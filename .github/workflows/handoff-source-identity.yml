name: Assistant handoff exact-source verification
on:
  push:
    branches: [stage37-assistant-handoff-20260917]
    paths: ['server/**', '.github/workflows/handoff-source-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable source baseline and audited additions (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          baseline=3fabb1f0d875141f3441b6bb583298e2bbd75d33
          expected_baseline_tree=70ca6d915dc120f8e39327cadcae37e835c30443
          expected_current_tree=70083784bbedd6c71a020873bc761b64efe48580
          baseline_tree=$(git rev-parse "$baseline:server")
          baseline_count=$(git ls-tree -r --name-only "$baseline" server | wc -l)
          current_tree=$(git rev-parse HEAD:server)
          current_count=$(git ls-files server | wc -l)
          printf 'baseline_server_git_tree=%s\ncurrent_server_git_tree=%s\nbaseline_tracked_files=%s\ncurrent_tracked_files=%s\n' "$baseline_tree" "$current_tree" "$baseline_count" "$current_count"
          test "$baseline_tree" = "$expected_baseline_tree"
          test "$current_tree" = "$expected_current_tree"
          test "$baseline_count" -eq 186
          test "$current_count" -eq 189
          git diff --name-status "$baseline" HEAD -- server > "$RUNNER_TEMP/audited-source-diff.txt"
          printf 'M\tserver/cmd/protocol-probe/latest_client_shop_exchange_contract.go\nA\tserver/cmd/protocol-probe/latest_client_shop_exchange_failclosed_test.go\nA\tserver/cmd/protocol-probe/latest_client_shop_exchange_form_partial_test.go\nM\tserver/cmd/protocol-probe/latest_client_shop_view_contract.go\nM\tserver/cmd/protocol-probe/latest_client_shop_view_contract_test.go\nM\tserver/cmd/protocol-probe/scene_lifecycle.go\nA\tserver/docs/CURRENT_SHOP_EXCHANGE_BIND_AUDIT_20260917.md\n' > "$RUNNER_TEMP/expected-source-diff.txt"
          diff -u "$RUNNER_TEMP/expected-source-diff.txt" "$RUNNER_TEMP/audited-source-diff.txt"
          echo 'EXACT_HANDOFF_BASELINE=PASS AUDITED_ADDITIONS=PASS'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Resolve real modules in CI-only modfile
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          go mod download -modfile=ci.real.mod
          test -z "$(gofmt -l cmd internal migrations)"
      - name: Export audited tracked source and public Go module download cache
        shell: bash
        run: |
          set -euo pipefail
          baseline=3fabb1f0d875141f3441b6bb583298e2bbd75d33
          test "$(git rev-parse "$baseline:server")" = '70ca6d915dc120f8e39327cadcae37e835c30443'
          test "$(git rev-parse HEAD:server)" = '70083784bbedd6c71a020873bc761b64efe48580'
          test "$(git ls-files server | wc -l)" -eq 189
          git archive --format=tar HEAD server | gzip -n > "$RUNNER_TEMP/stage37-exact-server.tar.gz"
          test -d "$(go env GOMODCACHE)/cache/download"
          tar -czf "$RUNNER_TEMP/stage37-go-module-cache.tar.gz" -C "$(go env GOMODCACHE)" cache/download
          cp server/ci.real.mod "$RUNNER_TEMP/ci.real.mod"
          cp server/ci.real.sum "$RUNNER_TEMP/ci.real.sum"
          printf 'baseline_server_git_tree=%s\ncurrent_server_git_tree=%s\nworkflow_commit=%s\nsource_scope=tracked_server_only\nmodule_scope=public_go_download_cache\n' '70ca6d915dc120f8e39327cadcae37e835c30443' "$(git rev-parse HEAD:server)" "$(git rev-parse HEAD)" > "$RUNNER_TEMP/PROVENANCE.txt"
          (cd "$RUNNER_TEMP" && sha256sum stage37-exact-server.tar.gz stage37-go-module-cache.tar.gz ci.real.mod ci.real.sum PROVENANCE.txt > MANIFEST.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-public-source-go-cache-20260917
          retention-days: 2
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/stage37-exact-server.tar.gz
            ${{ runner.temp }}/stage37-go-module-cache.tar.gz
            ${{ runner.temp }}/ci.real.mod
            ${{ runner.temp }}/ci.real.sum
            ${{ runner.temp }}/PROVENANCE.txt
            ${{ runner.temp }}/MANIFEST.sha256
      - name: Run non-protocol tests, vet and protocol compile
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list -modfile=ci.real.mod ./... | grep -v '^github.com/local/9yin-go-server/cmd/protocol-probe$')
          go test -modfile=ci.real.mod -count=1 "${pkgs[@]}"
          go test -modfile=ci.real.mod -c -o /tmp/handoff-protocol.test ./cmd/protocol-probe
          go vet -modfile=ci.real.mod ./...
          echo 'TESTS_AND_VET=PASS PROTOCOL_COMPILE=PASS PROTOCOL_FULL_RUNTIME=NOT_RUN'
      - name: Check private exact-current protocol fixtures (never upload)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          required=(resources/modern/share/skill/skill_new.ini resources/modern/share/skill/skill_static.ini resources/modern/share/skill/skill_normal_varprop.ini resources/modern/share/skill/skill_lock_varprop.ini resources/modern/share/skill/skill_consume.ini resources/modern/share/skill/damage_calculate.ini resources/modern/share/skill/attack_hitshape.ini resources/modern/share/skill/attack_targetshape.ini resources/modern/share/skill/buff_new.ini resources/modern/share/skill/buff_static.ini resources/modern/share/skill/buff_varprop.ini resources/modern/ini/action/zhaoshi_player.ini resources/modern/ini/action/zhaoshi_player_2.ini resources/modern/ini/action/zhaoshi_player_dodge.ini resources/modern/ini/action/zhaoshi_player_parry.ini resources/modern/ini/action/zhaoshi_clone.ini)
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              printf 'PRIVATE_FIXTURE_MISSING=%s\n' "$path"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo 'SHOP_REQUEST_PARSER_RUNTIME=NOT_RUN (private exact-current fixtures absent in public CI)'
            echo 'PROTOCOL_FULL_RUNTIME=NOT_RUN (private exact-current fixtures absent in public CI)'
            exit 0
          fi
          echo 'Required protocol fixture files exist; check their provenance before running resource-dependent tests.'
          echo 'SHOP_REQUEST_PARSER_RUNTIME=NOT_RUN (CI has no authenticated resource fingerprint manifest)'
          echo 'PROTOCOL_FULL_RUNTIME=NOT_RUN (CI has no authenticated resource fingerprint manifest)'
      - name: Windows amd64 cross-build (not LIVE)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -modfile=ci.real.mod -o /tmp/handoff-server.exe ./cmd/protocol-probe
          file /tmp/handoff-server.exe | grep -E 'PE32\+ executable.*x86-64'
          sha256sum /tmp/handoff-server.exe
          echo 'WINDOWS_BUILD=PASS LIVE_E2E=NOT_RUN'
