name: JIUYIN Stage37 Exchange 0x4F Verify

on:
  push:
    branches: [stage37-assistant-handoff-20260917]
    paths:
      - 'server/**'
      - '.github/workflows/jiuyin-stage37-exchange4f-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exchange-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      # The committed go.mod intentionally replaces public dependencies with
      # partial _builddeps stubs. Mirror the established Stage37 CI-only
      # modfile procedure; never edit or overwrite the production go.mod.
      - name: Resolve real public dependencies in CI-only modfile
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          go mod download -modfile=ci.real.mod
      - name: Exchange 0x4F preflight regressions
        run: go test -modfile=ci.real.mod ./cmd/protocol-probe -run 'TestCurrentShopExchangeBuy(WireRejectsMalformedTypedRequests|PreflightRejectsUnauthoredCoordinatesAndDefinitionDrift)$' -count=1
      - name: Go regression suite
        run: go test -modfile=ci.real.mod ./...
      - name: Go vet
        run: go vet -modfile=ci.real.mod ./...
      - name: Exchange 0x4F race regressions
        run: go test -race -modfile=ci.real.mod ./cmd/protocol-probe -run 'TestCurrentShopExchangeBuy(WireRejectsMalformedTypedRequests|PreflightRejectsUnauthoredCoordinatesAndDefinitionDrift)$' -count=1
      - name: Windows amd64 cross-build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p build
          go build -trimpath -modfile=ci.real.mod -o build/9yin-game-native-menu.exe ./cmd/protocol-probe
