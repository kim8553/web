name: jiuyin-stage37-network-probe

on:
  workflow_dispatch:
  push:
    branches: [stage37]
    paths:
      - '.github/workflows/jiuyin-stage37-network-probe.yml'

permissions:
  contents: read

jobs:
  dependency-network-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Show Go environment
        run: |
          go version
          go env GOPROXY GOSUMDB
      - name: Probe exact Stage37 dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/jiuyin-dep-probe
          cd /tmp/jiuyin-dep-probe
          go mod init probe.local/jiuyin
          go get github.com/DATA-DOG/go-sqlmock@v1.5.2
          go get github.com/go-sql-driver/mysql@v1.9.3
          go get golang.org/x/text@v0.28.0
          go get filippo.io/edwards25519@v1.1.0
          go get github.com/Hiroko103/go-quicklz@59904abc50d0d9505a38b160b50cdc5f9d6c6859
          go list -m all
