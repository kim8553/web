name: JIUYIN Stage37 Recovery Source Export

on:
  push:
    branches: [stage37-current-recovery-20260916]
    paths:
      - '.github/workflows/jiuyin-stage37-real-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble verified Stage37 handoff
        shell: bash
        run: |
          set -euxo pipefail
          cat JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part00 JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part01 > JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip
          echo '56a49fa0abb9b4aa6192a9e2d93f7e780c29e585cf11ccb3ff0cf9f398955fdb  JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip' | sha256sum -c -
          unzip -q JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip -d handoff
          test -f handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz
          sha256sum handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz | tee buildprobe_global_merged4.sha256

      - name: Upload recovered Stage37 source base
        uses: actions/upload-artifact@v4
        with:
          name: stage37-buildprobe-global-merged4-source
          path: |
            handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz
            buildprobe_global_merged4.sha256
          if-no-files-found: error
