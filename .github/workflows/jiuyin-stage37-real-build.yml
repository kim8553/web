name: JIUYIN Stage37 Current Recovery Real Build

on:
  push:
    branches: [stage37-current-recovery-20260916]
    paths:
      - '.github/workflows/jiuyin-stage37-real-build.yml'
      - 'tools/stage37_current_recovery_build.sh'
      - 'tools/stage37_current_recovery_stage2.sh'
      - 'tools/stage37_current_recovery_stage3.sh'
      - 'tools/stage37_current_recovery_stage4.sh'
      - 'tools/stage37_current_recovery_stage5.sh'
      - 'tools/stage37_current_recovery_stage6.sh'
      - 'tools/stage37_current_recovery_stage7.sh'
      - 'tools/stage37_current_recovery_stage8.sh'
      - 'tools/stage37_current_recovery_stage9.sh'
      - 'tools/stage37_current_recovery_stage10.sh'
      - 'tools/stage37_current_recovery_stage11.sh'
      - 'tools/stage37_current_recovery_stage12.sh'
      - 'tools/stage37_current_recovery_stage14.sh'
      - 'tools/stage37_current_recovery_stage15.sh'
      - 'tools/stage37_current_recovery_stage16.sh'
      - 'tools/stage37_current_recovery_stage17.sh'
      - 'tools/stage37_current_recovery_stage18.sh'
      - 'tools/stage37_current_recovery_stage19.sh'
      - 'tools/stage37_current_recovery_stage20.sh'
      - 'tools/stage37_current_recovery_stage21.sh'
      - 'tools/stage37_current_recovery_stage21_disable_unverified_legacy_shop_buy.py'
      - 'tools/stage37_current_recovery_stage22.sh'
      - 'tools/stage37_current_recovery_stage22_wire_trace_patch.py'
      - 'tools/stage37_current_recovery_stage23.sh'
      - 'tools/stage37_capture_shop_wire.ps1'
      - 'tools/stage37_shop_wire_diff.py'
      - 'tests/test_stage37_shop_wire_diff.py'
      - 'recovery/STAGE23_SHOP_WIRE_CAPTURE_KO.md'
      - 'tools/stage37_stage8_wire_exchange_gate.py'
      - 'tools/stage37_stage9_harden_persistence_ready.py'
      - 'recovery/postbuild_files/internal__shopbuygate__decision.go'
      - 'recovery/postbuild_files/internal__shopbuygate__decision_test.go'
      - 'recovery/postbuild_files/internal__shopbuyexecute__execute.go'
      - 'recovery/postbuild_files/internal__shopbuyexecute__execute_test.go'
      - 'recovery/postbuild_files/cmd__protocol-probe__latest_client_shop_buy_atomic_persistence.go'
      - 'recovery/postbuild_files/internal__shopbuypersist__persist.go'
      - 'recovery/postbuild_files/internal__shopbuypersist__persist_test.go'
      - 'recovery/postbuild_files/internal__shopbuyplan__plan.go'
      - 'recovery/postbuild_files/internal__shopbuyplan__plan_test.go'
      - 'recovery/postbuild_files/cmd__protocol-probe__latest_client_shop_buy_stage.go'
      - 'recovery/postbuild_files/internal__shopbuycommit__commit.go'
      - 'recovery/postbuild_files/internal__shopbuycommit__commit_test.go'
      - 'recovery/postbuild_files/cmd__protocol-probe__latest_client_shop_buy_commit.go'
      - 'recovery/postbuild_files/internal__shopbuypublish__publish.go'
      - 'recovery/postbuild_files/internal__shopbuypublish__publish_test.go'
      - 'recovery/postbuild_files/cmd__protocol-probe__latest_client_shop_buy_publish.go'
      - 'recovery/postbuild_files/internal__shopwiretrace__trace.go'
      - 'recovery/postbuild_files/internal__shopwiretrace__trace_test.go'
      - 'recovery/postbuild_files/cmd__protocol-probe__latest_client_shop_wire_trace.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Reconstruct and verify Stage23 read-only ordinary shop capture and offline diff
        shell: bash
        run: bash tools/stage37_current_recovery_stage23.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage37-current-recovery-verification
          path: |
            generated-manifest.txt
            generated-manifest.sha256
            modules.txt
            *.log
            *.exit
            protocol-probe.test
            protocol-probe-race.test
            stage37-current-windows-amd64.exe
            stage37-current-windows-amd64.sha256
            stage37-current-windows-amd64.file.txt
            stage37-current-windows-amd64.goversion.txt
            buildtree/ci.real.mod
            buildtree/ci.real.sum
          if-no-files-found: warn
