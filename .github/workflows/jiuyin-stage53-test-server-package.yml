name: JIUYIN Stage53 Windows Test Server
on:
  push:
    branches: [stage37-assistant-handoff-20260917]
    paths: [.github/workflows/jiuyin-stage53-test-server-package.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-server:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher syntax and compile server package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/stage53-test-server/run-stage53-test-server.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          Push-Location server
          try {
            go test -c -o "$env:RUNNER_TEMP\protocol-probe.test.exe" ./cmd/protocol-probe
            if ($LASTEXITCODE -ne 0) { throw 'protocol-probe compile test failed' }
            go build -trimpath -o "$env:RUNNER_TEMP\stage53-test-server.exe" ./cmd/protocol-probe
            if ($LASTEXITCODE -ne 0) { throw 'Stage53 Windows server build failed' }
          } finally { Pop-Location }
          if (-not (Test-Path "$env:RUNNER_TEMP\stage53-test-server.exe")) { throw 'server exe missing' }
          Write-Host 'WINDOWS_SERVER_COMPILE=PASS; LIVE_BOOT_AND_GAME_E2E=NOT_RUN'
      - name: Create clean test-server ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "$env:RUNNER_TEMP\stage53-test-server-package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$env:RUNNER_TEMP\stage53-test-server.exe" $pkg
          Copy-Item 'tools/stage53-test-server/run-stage53-test-server.ps1' $pkg
          Copy-Item 'tools/stage53-test-server/README_KO.md' $pkg
          $manifest = @(
            'Stage53 Windows test server',
            "Git commit: $env:GITHUB_SHA",
            'Build target: server/cmd/protocol-probe',
            'Normal NPC buy 0x46: Stage50-53 code included; user live E2E not yet proven',
            'Sale 0x47: not implemented',
            'GM grant and exchange 0x4F: deferred',
            'Package contains no resources, database, credentials, or client binaries'
          )
          [IO.File]::WriteAllLines((Join-Path $pkg 'BUILD_INFO.txt'), $manifest, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem $pkg -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $pkg 'SHA256SUMS.txt')
          $zip = "$env:RUNNER_TEMP\STAGE53_TEST_SERVER_WINDOWS_20260918.zip"
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'test server zip missing' }
          Write-Host "PACKAGE_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())"
      - name: Upload Stage53 test server
        uses: actions/upload-artifact@v4
        with:
          name: stage53-test-server-windows
          path: ${{ runner.temp }}/STAGE53_TEST_SERVER_WINDOWS_20260918.zip
          if-no-files-found: error
          retention-days: 14
      - name: Explicit limits
        shell: pwsh
        run: |
          Write-Host 'USER_DB=NOT_ACCESSED'
          Write-Host 'SERVER_LIVE_BOOT=NOT_RUN'
          Write-Host 'CLIENT_BUY_RECONNECT_E2E=NOT_RUN'
          Write-Host 'SALE_0X47=NOT_IMPLEMENTED; GM_AND_EXCHANGE_0X4F=DEFERRED'
