name: JIUYIN Stage58 Full Local Services

on:
  push:
    branches: [stage37-assistant-handoff-20260917]
    paths:
      - '.github/workflows/jiuyin-stage58-full-local-services.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage37-assistant-handoff-20260917

      - name: Verify original local-service contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = Get-Content -Raw 'server/启动本地九阴服务.bat'
          foreach ($needle in @('127.0.0.1:4000','127.0.0.1:19061','127.0.0.1:19062','loopback-lister.ps1')) {
            if (-not $original.Contains($needle)) { throw "original local-service contract missing: $needle" }
          }
          $lister = Get-Content -Raw 'server/loopback-lister.ps1'
          if (-not $lister.Contains('$svrlist #')) { throw 'original loopback server-list response missing' }
          if (-not $lister.Contains('19061 0')) { throw 'original loopback list does not target game port 19061' }
          Write-Host 'ORIGINAL_LOCAL_SERVICE_CONTRACT=PASS'

      - name: Verify Stage58 launcher syntax and contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('tools/stage58-live-services/run-stage58-live-services.ps1','server/loopback-lister.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Host; throw "PowerShell parse failed: $script" }
          }
          $launcher = Get-Content -Raw 'tools/stage58-live-services/run-stage58-live-services.ps1'
          foreach ($needle in @('4000','19061','19062','STAGE58_READY=YES','STAGE58_READY=NO','NINEYIN_SERVER_ROOT','Quote-ChildArg')) {
            if (-not $launcher.Contains($needle)) { throw "Stage58 launcher contract missing: $needle" }
          }
          Write-Host 'STAGE58_LAUNCHER_STATIC=PASS'

      - name: Exercise lister from a path containing spaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $spaceRoot = Join-Path $env:RUNNER_TEMP 'stage58 path with spaces'
          $outDir = Join-Path $spaceRoot 'lister output with spaces'
          New-Item -ItemType Directory -Force -Path $spaceRoot,$outDir | Out-Null
          $listerPath = Join-Path $spaceRoot 'loopback-lister.ps1'
          Copy-Item 'server/loopback-lister.ps1' $listerPath
          $args = @('-NoProfile','-ExecutionPolicy','Bypass','-File',('"' + $listerPath + '"'),'-Port','4017','-OutputDir',('"' + $outDir + '"'))
          $proc = Start-Process -FilePath 'powershell.exe' -ArgumentList $args -WorkingDirectory $spaceRoot -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(10)
            do {
              Start-Sleep -Milliseconds 250
              $ready = @(Get-NetTCPConnection -State Listen -LocalPort 4017 -ErrorAction SilentlyContinue).Count -gt 0
            } while (-not $ready -and -not $proc.HasExited -and (Get-Date) -lt $deadline)
            if (-not $ready) { throw 'lister did not listen from spaced path' }
            $client = [Net.Sockets.TcpClient]::new('127.0.0.1',4017)
            try {
              $stream = $client.GetStream()
              $request = [Text.Encoding]::ASCII.GetBytes("probe`r`n")
              $stream.Write($request,0,$request.Length)
              $buf = New-Object byte[] 4096
              $count = $stream.Read($buf,0,$buf.Length)
              $response = [Text.Encoding]::ASCII.GetString($buf,0,$count)
              if (-not $response.Contains('127.0.0.1 19061 0')) { throw "unexpected lister response: $response" }
            } finally { $client.Dispose() }
            if (-not (Test-Path (Join-Path $outDir 'request.bin'))) { throw 'spaced output-dir request capture missing' }
            Write-Host 'SPACED_PATH_LISTER_RUNTIME=PASS'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Verify retained startup and shop changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Get-Content -Raw 'server/cmd/protocol-probe/main.go'
          foreach ($needle in @('continuing without optional GM display-name localization','continuing with gift-box drop resolution disabled')) {
            if (-not $main.Contains($needle)) { throw "retained startup fix missing: $needle" }
          }
          $buy = Get-Content -Raw 'server/cmd/protocol-probe/latest_client_normal_shop_atomic_buy.go'
          if (-not $buy.Contains('normalShopAtomicBuy')) { throw 'normal buy 0x46 implementation missing' }
          Write-Host 'RETAINED_STAGE54_57_SOURCE=PASS'

      - name: Compile Windows server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location server
          try {
            go test -c -o "$env:RUNNER_TEMP\protocol-probe.test.exe" ./cmd/protocol-probe
            if ($LASTEXITCODE -ne 0) { throw 'compile test failed' }
            go build -trimpath -o "$env:RUNNER_TEMP\stage58-live-server.exe" ./cmd/protocol-probe
            if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          } finally { Pop-Location }
          $helpDir = Join-Path $env:RUNNER_TEMP 'stage58 server arg path with spaces'
          New-Item -ItemType Directory -Force -Path $helpDir | Out-Null
          $helpLog = Join-Path $helpDir 'runtime log with spaces.log'
          $helpArgs = @('-log-file',('"' + $helpLog + '"'),'-h')
          $helpProc = Start-Process -FilePath "$env:RUNNER_TEMP\stage58-live-server.exe" -ArgumentList $helpArgs -Wait -PassThru
          if ($helpProc.ExitCode -ne 0) { throw "server spaced-path argument probe failed exit=$($helpProc.ExitCode)" }
          Write-Host 'WINDOWS_COMPILE=PASS; SPACED_SERVER_ARG=PASS; USER_LIVE_E2E_NOT_RUN'

      - name: Build Stage58 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "$env:RUNNER_TEMP\stage58-pkg"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'logs') | Out-Null
          Copy-Item "$env:RUNNER_TEMP\stage58-live-server.exe" $pkg
          Copy-Item 'server/loopback-lister.ps1' $pkg
          Copy-Item 'tools/stage58-live-services/run-stage58-live-services.ps1' $pkg
          Copy-Item 'tools/stage58-live-services/RUN_STAGE58_LIVE.bat' $pkg
          Copy-Item 'tools/stage58-live-services/README_KO.md' $pkg
          $head = git rev-parse HEAD
          $info = @(
            'Stage58 full local services Windows test package',
            "Source branch head: $head",
            'Server lineage: user-supplied 9yin-go-server1.rar -> current kim8553/web Go source',
            'Original local-service contract restored: list 4000 + game 19061 + GM 19062',
            'loopback-lister.ps1 copied unchanged from server runtime source',
            'Spaced-path lister launch: PASS',
            'Spaced-path server argument probe: PASS',
            'Stage54 normal buy 0x46 JSON/MySQL persistence retained',
            'Stage55/56/57 startup compatibility changes retained',
            'Compile: PASS',
            'User latest-client LIVE/E2E: NOT RUN'
          )
          [IO.File]::WriteAllLines((Join-Path $pkg 'BUILD_INFO.txt'), $info, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem $pkg -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $pkg 'SHA256SUMS.txt')
          $zip = "$env:RUNNER_TEMP\STAGE58_9YIN_GO_SERVER1_FULL_LOCAL_SERVICES_WINDOWS_20260918.zip"
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "PACKAGE_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())"

      - uses: actions/upload-artifact@v4
        with:
          name: stage58-9yin-go-server1-full-local-services-windows
          path: ${{ runner.temp }}/STAGE58_9YIN_GO_SERVER1_FULL_LOCAL_SERVICES_WINDOWS_20260918.zip
          if-no-files-found: error
          retention-days: 14
