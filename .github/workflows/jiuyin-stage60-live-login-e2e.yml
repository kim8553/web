name: JIUYIN Stage60 LIVE Login E2E Package

on:
  push:
    branches: [stage37-assistant-handoff-20260917]
    paths:
      - 'server/internal/role/json_login_adoption.go'
      - 'server/internal/role/json_login_adoption_test.go'
      - 'server/cmd/protocol-probe/role_store.go'
      - 'server/cmd/protocol-probe/latest_client_json_login_identity_adoption_test.go'
      - 'server/loopback-lister.ps1'
      - 'tools/stage60-live-login-e2e/**'
      - '.github/workflows/jiuyin-stage60-live-login-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage37-assistant-handoff-20260917

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Verify Stage60 lineage and local-service contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = Get-Content -Raw 'server/启动本地九阴服务.bat'
          foreach ($needle in @('127.0.0.1:4000','127.0.0.1:19061','127.0.0.1:19062','loopback-lister.ps1')) {
            if (-not $original.Contains($needle)) { throw "original local-service contract missing: $needle" }
          }
          $launcher = Get-Content -Raw 'tools/stage60-live-login-e2e/run-stage60-live-services.ps1'
          foreach ($needle in @(
            'NINEYIN_SERVER_ROOT',
            'stage60-backups',
            'roles.before-stage60-login.',
            'Stage60 refuses to reuse old listeners',
            '4000,19061,19062',
            'STAGE60_READY=YES',
            'STAGE60_LIVE_RESULT_',
            'LOGIN_OPCODE_0X02_SEEN',
            'ROLE_LIST_SENT',
            'ROLE_CHOSEN_SCENE_INIT'
          )) {
            if (-not $launcher.Contains($needle)) { throw "Stage60 launcher guard missing: $needle" }
          }
          Write-Host 'STAGE60_LINEAGE_AND_STATIC_GUARDS=PASS'

      - name: Verify Stage59 JSON adoption guardrails remain intact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $adopt = Get-Content -Raw 'server/internal/role/json_login_adoption.go'
          foreach ($needle in @('AdoptSoleUnverifiedLoginAccount','acct:v1:','ErrAmbiguousLegacyLoginAccount','len(identity.PasswordHash) != 0','originalIdentity := candidateIdentity')) {
            if (-not $adopt.Contains($needle)) { throw "Stage59 adoption guard missing: $needle" }
          }
          $store = Get-Content -Raw 'server/cmd/protocol-probe/role_store.go'
          if (-not $store.Contains('store.accounts.(*role.JSONRepository)')) { throw 'Stage59 login path is not JSON-only' }
          if (-not $store.Contains('AdoptSoleUnverifiedLoginAccount')) { throw 'Stage59 login adoption call missing' }
          Write-Host 'STAGE59_ADOPTION_GUARDS_STILL_PASS'

      - name: Run Stage59 targeted JSON adoption tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'server/internal/role'
          try {
            go test json_login_adoption.go json_m2_repository.go json_repository.go model.go mysql_repository.go repository.go zz_recovered_overlay.go json_login_adoption_test.go
            if ($LASTEXITCODE -ne 0) { throw 'Stage59 JSON adoption tests failed under Stage60' }
          } finally { Pop-Location }
          Write-Host 'STAGE60_JSON_ADOPTION_TESTS=PASS'

      - name: Run roleStore login-path test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'server/cmd/protocol-probe'
          try {
            go test role_store.go runtime_paths.go latest_client_json_login_identity_adoption_test.go
            if ($LASTEXITCODE -ne 0) { throw 'Stage60 roleStore login-path test failed' }
          } finally { Pop-Location }
          Write-Host 'STAGE60_ROLESTORE_LOGIN_TEST=PASS'

      - name: Exercise server-list lister
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'stage60-lister'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $lister = (Resolve-Path 'server/loopback-lister.ps1').Path
          $args = @('-NoProfile','-ExecutionPolicy','Bypass','-File',('"' + $lister + '"'),'-Port','4019','-OutputDir',('"' + $outDir + '"'))
          $proc = Start-Process -FilePath 'powershell.exe' -ArgumentList $args -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 250
              $ready = @(Get-NetTCPConnection -State Listen -LocalPort 4019 -ErrorAction SilentlyContinue).Count -gt 0
            } while (-not $ready -and -not $proc.HasExited -and (Get-Date) -lt $deadline)
            if (-not $ready) { throw 'Stage60 lister did not listen' }
            $client = [Net.Sockets.TcpClient]::new('127.0.0.1',4019)
            try {
              $stream = $client.GetStream()
              $request = [Text.Encoding]::ASCII.GetBytes("probe`r`n")
              $stream.Write($request,0,$request.Length)
              $buf = New-Object byte[] 4096
              $count = $stream.Read($buf,0,$buf.Length)
              $response = [Text.Encoding]::ASCII.GetString($buf,0,$count)
              if (-not $response.Contains('127.0.0.1 19061 0')) { throw "unexpected lister response: $response" }
            } finally { $client.Dispose() }
            if (-not (Test-Path (Join-Path $outDir 'request.bin'))) { throw 'lister request capture missing' }
            Write-Host 'STAGE60_LISTER_RUNTIME=PASS'
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Compile Windows server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location server
          try {
            go test -c -o "$env:RUNNER_TEMP\protocol-probe.test.exe" ./cmd/protocol-probe
            if ($LASTEXITCODE -ne 0) { throw 'protocol package compile test failed' }
            go build -trimpath -o "$env:RUNNER_TEMP\stage60-live-server.exe" ./cmd/protocol-probe
            if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          } finally { Pop-Location }
          Write-Host 'STAGE60_WINDOWS_COMPILE_BUILD=PASS'

      - name: Record runtime-resource boot gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ciSkill = 'server/resources/modern/share/skill/skill_new.ini'
          if (Test-Path -LiteralPath $ciSkill) {
            throw 'Unexpected full runtime skill resource is present in GitHub checkout; re-audit Stage60 CI assumptions.'
          }
          $launcher = Get-Content -Raw 'tools/stage60-live-login-e2e/run-stage60-live-services.ps1'
          if (-not $launcher.Contains('resources\modern\share\skill\skill_new.ini')) {
            throw 'Stage60 launcher no longer requires the original runtime skill resource.'
          }
          Write-Host 'STAGE60_CI_SERVER_BOOT=NOT_RUN'
          Write-Host 'Reason: GitHub checkout intentionally does not contain the user 9yin-go-server1 runtime resource skill_new.ini.'
          Write-Host 'Actual server boot remains a Stage60 LIVE gate on the user-supplied 9yin-go-server1 runtime root.'

      - name: Build Stage60 LIVE package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = "$env:RUNNER_TEMP\stage60-pkg"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$env:RUNNER_TEMP\stage60-live-server.exe" $pkg
          Copy-Item 'server/loopback-lister.ps1' $pkg
          Copy-Item 'tools/stage60-live-login-e2e/run-stage60-live-services.ps1' $pkg
          Copy-Item 'tools/stage60-live-login-e2e/RUN_STAGE60_LIVE.bat' $pkg
          Copy-Item 'tools/stage60-live-login-e2e/README_KO.md' $pkg
          $head = git rev-parse HEAD
          $info = @(
            'Stage60 latest-client LIVE login E2E diagnostic package',
            "Source branch head: $head",
            'Server lineage: user-supplied 9yin-go-server1.rar -> current kim8553/web Go source',
            'Stage59 JSON identity adoption guardrails retained',
            'Original local-service contract: list 4000 + game 19061 + GM 19062',
            'Stage60 refuses to reuse pre-existing listeners',
            'JSON launcher backup + SHA256 verification: enabled',
            'Stage59 targeted JSON adoption tests under Stage60: PASS',
            'roleStore login-path test under Stage60: PASS',
            'lister runtime test: PASS',
            'Windows compile/build: PASS',
            'Windows CI server boot: NOT RUN (GitHub checkout lacks user 9yin-go-server1 runtime skill_new.ini)',
            'User Windows server boot on actual runtime root: NOT RUN by CI',
            'User current-client LIVE login/scene/reconnect: NOT RUN by CI'
          )
          [IO.File]::WriteAllLines((Join-Path $pkg 'BUILD_INFO.txt'), $info, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem $pkg -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $pkg 'SHA256SUMS.txt')
          $zip = "$env:RUNNER_TEMP\STAGE60_9YIN_GO_SERVER1_LIVE_LOGIN_E2E_WINDOWS_20260918.zip"
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "SERVER_SHA256=$((Get-FileHash (Join-Path $pkg 'stage60-live-server.exe') -Algorithm SHA256).Hash.ToLower())"
          Write-Host "PACKAGE_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())"

      - uses: actions/upload-artifact@v4
        with:
          name: stage60-9yin-go-server1-live-login-e2e-windows
          path: ${{ runner.temp }}/STAGE60_9YIN_GO_SERVER1_LIVE_LOGIN_E2E_WINDOWS_20260918.zip
          if-no-files-found: error
          retention-days: 14
