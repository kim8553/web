name: JIUYIN Stage60 Offline Source Verification
on:
  push:
    branches: [stage37-assistant-handoff-20260917]
    paths:
      - '.github/workflows/jiuyin-stage60-source-offline-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage37-assistant-handoff-20260917
      - name: Pack exact corrected server source without client or user data
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > STAGE60_SOURCE_COMMIT.txt
          tar -czf "$RUNNER_TEMP/stage60-source.tar.gz" --exclude='server/resources' --exclude='server/logs' --exclude='server/build' server STAGE60_SOURCE_COMMIT.txt
          tar -tzf "$RUNNER_TEMP/stage60-source.tar.gz" > "$RUNNER_TEMP/stage60-source-files.txt"
          grep -qx 'server/go.mod' "$RUNNER_TEMP/stage60-source-files.txt"
          echo 'STAGE60_SOURCE_EXPORT=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: stage60-corrected-server-source-offline
          path: ${{ runner.temp }}/stage60-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Vendor exact Go dependencies for resource-backed offline tests
        shell: bash
        run: |
          set -euo pipefail
          cd server
          # Offline test copy only: repository's local sqlmock shim has no Go files.
          # Remove that replacement in this runner without modifying exported source.
          go mod edit -dropreplace github.com/DATA-DOG/go-sqlmock
          go mod vendor
          test -f vendor/github.com/Hiroko103/go-quicklz/main.go
          test -f vendor/golang.org/x/text/encoding/simplifiedchinese/gbk.go
          test -f vendor/github.com/DATA-DOG/go-sqlmock/sqlmock.go
          cp go.mod "$RUNNER_TEMP/stage60-offline-go.mod"
          tar -czf "$RUNNER_TEMP/stage60-vendor.tar.gz" vendor
          echo 'STAGE60_DEPENDENCY_VENDOR=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: stage60-corrected-server-vendor-offline
          path: |
            ${{ runner.temp }}/stage60-vendor.tar.gz
            ${{ runner.temp }}/stage60-offline-go.mod
          if-no-files-found: error
          retention-days: 3
