name: Mission mode3 shop view patch 348abaa1

on:
  push:
    branches:
      - mission/source-export-348abaa1
    paths:
      - .github/workflows/mission-mode3-shop-view-patch-348abaa1.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact target parent
        uses: actions/checkout@v4
        with:
          ref: 2b33d2ca8124bda32b1db815c4b0fd7fabcdfabc
          fetch-depth: 2

      - name: Verify exact parent and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2b33d2ca8124bda32b1db815c4b0fd7fabcdfabc"
          test -z "$(git status --porcelain=v1)"
          git fetch origin mission/source-export-348abaa1
          git show origin/mission/source-export-348abaa1:recovery/mission_mode3_shop_view_348abaa1.patch > /tmp/mode3.patch
          echo '284644d1d35ff52477d90ed0c5363a143e8e5ba3a775f4a28addb41ea94fc768  /tmp/mode3.patch' | sha256sum -c -
          patch --batch --forward -p1 < /tmp/mode3.patch
          gofmt -w server/cmd/protocol-probe/latest_client_shop_view_contract.go server/cmd/protocol-probe/scene_lifecycle.go server/cmd/protocol-probe/latest_client_shop_view_contract_test.go
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '3'

      - name: Verify exact mode3 semantics without private runtime resources
        shell: bash
        working-directory: server/cmd/protocol-probe
        run: |
          set -euo pipefail
          cat > zz_ci_shop_view_stub.go <<'EOF_STUB'
          package main

          var defaultModernShareRoot = "."

          type serverViewProperty struct {
              index uint16
              text  *string
              int32 *int32
          }

          func viewString(index uint16, value string) serverViewProperty { return serverViewProperty{index: index, text: &value} }
          func viewInt(index uint16, value int32) serverViewProperty { return serverViewProperty{index: index, int32: &value} }
          EOF_STUB
          cat > zz_ci_shop_view_isolated_test.go <<'EOF_TEST'
          package main

          import "testing"

          func TestMode3ViewVisibilityCI(t *testing.T) {
              cases := []struct { item shopCatalogItem; want bool }{
                  {shopCatalogItem{priceMode: 0}, true},
                  {shopCatalogItem{priceMode: 1}, true},
                  {shopCatalogItem{priceMode: 2}, true},
                  {shopCatalogItem{priceMode: 3, exchangeData: 13097}, true},
                  {shopCatalogItem{priceMode: 3, exchangeData: 0}, false},
                  {shopCatalogItem{priceMode: 3, exchangeData: -1}, false},
                  {shopCatalogItem{priceMode: 4, exchangeData: 13097}, false},
              }
              for i, tc := range cases {
                  if got := currentShopItemVisibleInView(tc.item); got != tc.want { t.Fatalf("case %d got=%v want=%v", i, got, tc.want) }
              }
          }

          func TestMode3ExchangeDataOrdinalCI(t *testing.T) {
              props := latestClientShopItemProperties(shopCatalogItem{configID: "item", amount: 1, priceMode: 3, exchangeData: 13097})
              last := props[len(props)-1]
              if last.index != 233 || last.int32 == nil || *last.int32 != 13097 { t.Fatalf("last=%#v", last) }
              props = latestClientShopItemProperties(shopCatalogItem{configID: "item", amount: 1, priceMode: 3, exchangeData: 0})
              for _, p := range props { if p.index == 233 { t.Fatal("invalid mode3 emitted ExchangeData") } }
          }

          func TestShopViewObjectIndexFormulaCI(t *testing.T) {
              cases := []struct { page, pos int32; want uint16 }{{0, 0, 1}, {0, 35, 36}, {1, 0, 501}, {4, 35, 2036}}
              for _, tc := range cases {
                  got, ok := currentShopViewObjectIndex(shopCatalogItem{page: tc.page, position: tc.pos})
                  if !ok || got != tc.want { t.Fatalf("page=%d pos=%d got=%d ok=%v want=%d", tc.page, tc.pos, got, ok, tc.want) }
              }
          }
          EOF_TEST
          trap 'rm -f zz_ci_shop_view_stub.go zz_ci_shop_view_isolated_test.go' EXIT
          GO111MODULE=off go test -count=1 shop_catalog.go latest_client_shop_view_contract.go zz_ci_shop_view_stub.go zz_ci_shop_view_isolated_test.go

      - name: Set up Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Run real dependency gates
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          go mod edit -modfile=ci.real.mod -dropreplace=github.com/go-sql-driver/mysql
          go mod edit -modfile=ci.real.mod -dropreplace=golang.org/x/text
          go mod edit -modfile=ci.real.mod -dropreplace=filippo.io/edwards25519
          go mod edit -modfile=ci.real.mod -dropreplace=github.com/DATA-DOG/go-sqlmock
          go mod edit -modfile=ci.real.mod -dropreplace=github.com/Hiroko103/go-quicklz
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod download -modfile=ci.real.mod
          mapfile -t pkgs < <(go list -modfile=ci.real.mod ./... | grep -v '^github.com/local/9yin-go-server/cmd/protocol-probe$')
          test "${#pkgs[@]}" -gt 0
          go test -modfile=ci.real.mod "${pkgs[@]}" -count=1
          go test -modfile=ci.real.mod -c -o /tmp/protocol-probe.test ./cmd/protocol-probe
          go vet -modfile=ci.real.mod ./...
          go build -modfile=ci.real.mod -o /tmp/protocol-probe ./cmd/protocol-probe
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=ci.real.mod -o /tmp/stage37-live-server.exe ./cmd/protocol-probe
          rm -f ci.real.mod ci.real.sum
          echo 'PROTOCOL_RUNTIME_NOT_RUN: private exact-current resource corpus is intentionally absent from public GitHub.'

      - name: Publish exactly three source/test files
        shell: bash
        env:
          TARGET_BRANCH: stage37-assistant-handoff-20260917
          EXPECTED_PARENT: 2b33d2ca8124bda32b1db815c4b0fd7fabcdfabc
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_PARENT"
          git config user.name 'OpenAI Assistant'
          git config user.email 'assistant@users.noreply.github.com'
          git add server/cmd/protocol-probe/latest_client_shop_view_contract.go server/cmd/protocol-probe/scene_lifecycle.go server/cmd/protocol-probe/latest_client_shop_view_contract_test.go
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'
          git commit -m 'Shop: include valid mode3 exchange items in view'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PUBLISHED_SHA=$NEW_SHA"
