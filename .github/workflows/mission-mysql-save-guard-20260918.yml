name: Temporary exact missing-MySQL store guard transport
on:
  push:
    branches: [stage37-restored-20260918]
    paths: ['.github/workflows/mission-mysql-save-guard-20260918.yml']
permissions:
  contents: write
jobs:
  apply-verified-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check exact source and publish only the reviewed save failure patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7387cd4efd4d2db70dc772018bdad7bbacfafd6f'
          test "$(git hash-object server/cmd/protocol-probe/zz_recovered_overlay.go)" = 'ec375f90d32198535ff6c9e10f1b54a45d6ebe99'
          test "$(git hash-object server/cmd/protocol-probe/mysql_store_missing_connection_test.go)" = '1411b0c5b916b33999ab2c078b28870aefabd7a7'
          printf '%s  %s\n' 'a8356950816929e72863f0528d59505ca59baf709beba2be807af63289632560' '.github/mission-mysql-save-guard-20260918.patch' | sha256sum --check
          git apply --check --index .github/mission-mysql-save-guard-20260918.patch
          git apply --index .github/mission-mysql-save-guard-20260918.patch
          test "$(git hash-object server/cmd/protocol-probe/zz_recovered_overlay.go)" = '9329ab12bedba7c7089d959f59f12e1de7563641'
          git diff --cached --check
          test "$(git diff --cached --name-only)" = 'server/cmd/protocol-probe/zz_recovered_overlay.go'
          git -c user.name='GitHub Actions' -c user.email='actions@users.noreply.github.com' commit -m 'fix(db): reject missing MySQL bag and currency connections instead of false success'
          git push origin HEAD:refs/heads/stage37-restored-20260918
          echo "MYSQL_SAVE_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "MYSQL_SAVE_OVERLAY_BLOB=$(git hash-object server/cmd/protocol-probe/zz_recovered_overlay.go)"
