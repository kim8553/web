name: Temporary shop Go dependency supply 39208183
on:
  push:
    branches:
      - mission/shop-db-source-39208183
    paths:
      - .github/workflows/mission-shop-go-deps-39208183.yml
permissions:
  contents: read
jobs:
  supply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8a26edfa22422a6a6d3e5d7874453cacfcebc42
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Acquire pinned project dependencies and preserve vendor sources
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          go mod vendor -modfile=ci.real.mod
          tar -czf ../shop-db-go-dependencies.tar.gz vendor ci.real.mod ci.real.sum
          cd ..
          sha256sum shop-db-go-dependencies.tar.gz > shop-db-go-dependencies.sha256
          cat shop-db-go-dependencies.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: shop-db-go-dependencies-39208183
          path: |
            shop-db-go-dependencies.tar.gz
            shop-db-go-dependencies.sha256
          retention-days: 1
          if-no-files-found: error
