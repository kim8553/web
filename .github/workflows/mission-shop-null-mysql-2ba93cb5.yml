name: Temporary shop NULL metadata disposable MySQL 2ba93cb5
on:
  push:
    branches: [mission/shop-null-metadata-2ba93cb5]
    paths: ['.github/workflows/mission-shop-null-mysql-2ba93cb5.yml']
permissions:
  contents: read
jobs:
  verify-exact-published-sha:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: shop_atomic_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aa2e859db281114b727b9ab4bfd53678fb4d010
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify exact published tree and purchase durability in disposable DB
        working-directory: server
        shell: bash
        env:
          JIUYIN_TEST_SHOP_MYSQL_CI: '1'
          JIUYIN_TEST_SHOP_MYSQL_DSN: 'root@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3aa2e859db281114b727b9ab4bfd53678fb4d010
          test "$(git rev-parse HEAD^{tree})" = a6e312882043cc2b420da9bbf221597f8f3fb3b1
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          test -z "$(gofmt -l internal/shopbuyatomic/checked.go internal/shopbuyatomic/checked_nullable_zero_test.go internal/shopbuyatomic/checked_mysql_integration_test.go)"
          go test -modfile=ci.real.mod -count=1 -v ./internal/shopbuyatomic
          echo 'DISPOSABLE_MYSQL_NULL_EMPTY_METADATA=PASS USER_PC_MYSQL=NOT_RUN LIVE_E2E=NOT_RUN'
