name: Startup Go dependency supply 47b9e1a2
on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - .github/workflows/mission-supply-go-modules-47b9e1a2.yml
permissions:
  contents: read
jobs:
  supply-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify exact source and vendor pinned modules
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = da690f674a516a3a1402018bd8ec9353cdc927d0
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for module in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$module"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          go mod vendor -modfile=ci.real.mod
          mkdir -p "$RUNNER_TEMP/stage37-go-deps"
          mv vendor ci.real.mod ci.real.sum "$RUNNER_TEMP/stage37-go-deps/"
          cd "$RUNNER_TEMP"
          tar -czf stage37-go-deps-47b9e1a2.tar.gz stage37-go-deps
          sha256sum stage37-go-deps-47b9e1a2.tar.gz > stage37-go-deps-47b9e1a2.sha256
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > stage37-go-deps-source-head.txt
          cat stage37-go-deps-47b9e1a2.sha256 stage37-go-deps-source-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-go-deps-47b9e1a2
          path: |
            ${{ runner.temp }}/stage37-go-deps-47b9e1a2.tar.gz
            ${{ runner.temp }}/stage37-go-deps-47b9e1a2.sha256
            ${{ runner.temp }}/stage37-go-deps-source-head.txt
          retention-days: 1
          if-no-files-found: error
