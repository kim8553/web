name: One-time exact NPC creator case patch transport 0819fff0

on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - server/tools/scene-case-0819fff0.patch

permissions:
  contents: write

jobs:
  apply-exact-verified-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate source and patch, publish exact tested tree, remove mission files
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'stage37-restored-20260918'
          test "$(git rev-parse HEAD^)" = '97ddf19b31ea3b41feab623e8f9d7d65afb27827'
          test "$(git diff --name-only HEAD^ HEAD)" = "$(printf '%s\n' '.github/workflows/scene-case-0819fff0-transport.yml' 'server/tools/scene-case-0819fff0.patch')"
          printf '%s  %s\n' '0819fff0a6ba6f2c0e9abd6c8446427e971f4f92415c79966d90a55beb2c84d4' 'server/tools/scene-case-0819fff0.patch' | sha256sum -c -
          git apply --check --index server/tools/scene-case-0819fff0.patch
          git apply --index server/tools/scene-case-0819fff0.patch
          git rm -f -- server/tools/scene-case-0819fff0.patch .github/workflows/scene-case-0819fff0-transport.yml
          test "$(git write-tree)" = 'b59b563f0a6d39c68a1dd8eabe19cc7f9f86a196'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(npc): resolve creator manifest filenames independent of casing'
          git push origin HEAD:refs/heads/stage37-restored-20260918
