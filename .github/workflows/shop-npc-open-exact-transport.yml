name: One-time exact NPC shop purchase patch transport

on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - server/tools/shop-npc-open-exact.patch

permissions:
  contents: write

jobs:
  apply-reviewed-exact-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify ancestry and exact patch, apply and clean one-time transport
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'stage37-restored-20260918'
          test "$(git rev-parse HEAD^^)" = 'd90445542cf8dcc0ff70294da077387602e5f0ea'
          test "$(git diff --name-only HEAD^ HEAD)" = 'server/tools/shop-npc-open-exact.patch'
          test "$(git diff --name-only HEAD^^ HEAD^)" = '.github/workflows/shop-npc-open-exact-transport.yml'
          printf '%s  %s\n' 'eb5275c690efdd9a995292cc2ea346a4135b86b3e0d35238f2e543e5c3c707b2' 'server/tools/shop-npc-open-exact.patch' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/tools/shop-npc-open-exact.patch')
          contents = path.read_bytes()
          target = b'\n diff --git a/server/docs/SHOP_NPC_OPEN_PURCHASE_AUTHORIZATION_20260918.md'
          assert contents.count(target) == 1, 'unexpected transport whitespace'
          path.write_bytes(contents.replace(target, target.replace(b'\n ', b'\n', 1)))
          PY
          printf '%s  %s\n' 'd5309546aa62fbb6168c2e7d047f5a5ec55a015dfefe0104f67c0bb61123d6f7' 'server/tools/shop-npc-open-exact.patch' | sha256sum -c -
          git apply --check --index server/tools/shop-npc-open-exact.patch
          git apply --index server/tools/shop-npc-open-exact.patch
          test "$(git hash-object server/cmd/protocol-probe/main.go)" = 'de9dd4aaecd50e679076de44f6c48f4c237a037e'
          test "$(git hash-object server/cmd/protocol-probe/scene_lifecycle.go)" = 'c6bee28b69ee5704e504823d6536f065089ca9f2'
          test "$(git hash-object server/cmd/protocol-probe/shop_open_authorization_test.go)" = '032ebfc57ff8989c2153372d12d0cc456bcbbff4'
          test "$(git hash-object server/cmd/protocol-probe/zz_recovered_overlay.go)" = '030ffdfcc6ac7f1f9a66329212d43c37601922ab'
          test "$(git hash-object server/docs/SHOP_NPC_OPEN_PURCHASE_AUTHORIZATION_20260918.md)" = '2714fe7abefe17278ff3ec381614d089f263f6fb'
          git rm -- server/tools/shop-npc-open-exact.patch .github/workflows/shop-npc-open-exact-transport.yml
          test "$(git write-tree)" = 'c850bee9159c7c33d6316c345870e8dbbd6aa543'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(shop): authorize buys only for NPC-opened shop on the connection'
          git push origin HEAD:refs/heads/stage37-restored-20260918
