name: Stage37 Current Client Built-in Ident Contract

on:
  push:
    branches: [stage37]
    paths:
      - 'tools/stage37_builtin_ident_followup.py'
      - '.github/workflows/stage37-builtin-ident-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Reassemble exact Stage37 handoff
        shell: bash
        run: |
          set -euxo pipefail
          cat JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part00 JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part01 > handoff.zip
          echo '56a49fa0abb9b4aa6192a9e2d93f7e780c29e585cf11ccb3ff0cf9f398955fdb  handoff.zip' | sha256sum -c -
          unzip -q handoff.zip -d handoff
          mkdir buildtree
          tar -xzf handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz -C buildtree

      - name: Apply exact reconstruction and proven latest-client overlays
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/stage37_authority_compile_patch.py buildtree
          python3 tools/stage37_authority_test_patch.py buildtree
          python3 tools/stage37_authority_test_followup.py buildtree
          python3 tools/stage37_authority_runtime_patch.py buildtree
          base64 -d tools/stage37_authority_resource_test_patch.py.gz.b64 | gzip -dc > /tmp/rp.py
          echo '2a6cbcf3e7c7b6087f0eecc24b09375abcd3559614bbafca12806a8c147aeeb8  /tmp/rp.py' | sha256sum -c -
          python3 /tmp/rp.py buildtree
          base64 -d tools/stage37_authority_resource_test_followup.py.gz.b64 | gzip -dc > /tmp/rf.py
          echo '826fe3feefbadffb3b6c8f75a1d5f74a19c956d38b2294c1ba98996c96fcfec7  /tmp/rf.py' | sha256sum -c -
          python3 /tmp/rf.py buildtree
          python3 tools/stage37_authority_resource_test_final.py buildtree
          python3 tools/stage37_authority_yihua_exact_test_patch.py buildtree
          python3 tools/stage37_latest_client_scene_compat_patch.py buildtree
          python3 tools/stage37_latest_client_player_location_compat_patch.py buildtree
          python3 tools/stage37_latest_client_legacy_born02_remap_patch.py buildtree
          python3 tools/stage37_latest_client_player_property_ordinal_patch.py buildtree
          python3 tools/stage37_latest_client_bag_view_ordinal_patch.py buildtree
          python3 tools/stage37_latest_client_bag_refresh_reentry_sync_patch.py buildtree
          python3 tools/stage37_latest_client_current_bag_wire_reentry_drain_patch.py buildtree
          python3 tools/stage37_latest_client_counted_bag_full_reentry_patch.py buildtree
          python3 tools/stage37_latest_client_full_bag_add_gm_ack_patch.py buildtree
          python3 tools/stage37_latest_client_bag_no_synthetic_viewid_patch.py buildtree
          python3 tools/stage37_latest_client_legacy_bag_rich_object_patch.py buildtree
          python3 tools/stage37_builtin_ident_followup.py buildtree
          find buildtree/cmd buildtree/internal -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Assert exact built-in Ident wire contract
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'return 2, true' buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go
          grep -F 'return 121, true' buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go
          grep -F 'case 205: // ItemType/int32 in the original negotiated table' buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go
          grep -F 'case 228: // append-only ViewID/int32' buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go
          if grep -Fq 'case 229:' buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go; then
            echo 'ERROR: Ident ordinal 229 still required by bag frame validator'
            exit 1
          fi
          if grep -Fq 'viewString(229' buildtree/cmd/protocol-probe/latest_client_bag_view_ordinal_compat.go; then
            echo 'ERROR: Ident ordinal 229 still emitted on bag wire'
            exit 1
          fi
          awk '/func sceneVisiblePropertyFields\(/,/^}/' buildtree/cmd/protocol-probe/main.go > /tmp/scene_fields.txt
          grep -F 'Name: "ViewID", Type: clientdata.WireInt32' /tmp/scene_fields.txt
          if grep -Fq 'Name: "Ident"' /tmp/scene_fields.txt; then
            echo 'ERROR: built-in Ident is still negotiated in player property table'
            exit 1
          fi
          grep -F 'latestClientPlayerWirePropertyTableCount != 229' buildtree/cmd/protocol-probe/latest_client_player_property_ordinal_compat_test.go
          grep -F 'Ident must be built-in/read-only and not negotiated' buildtree/cmd/protocol-probe/latest_client_current_bag_wire_test.go
          grep -F 'Ident ordinal 229 must not be emitted' buildtree/cmd/protocol-probe/latest_client_bag_view_ordinal_compat_test.go
          grep -F 'time.After(20 * time.Second)' buildtree/cmd/protocol-probe/gm_panel.go
          grep -F 'write full player re-entry spawn' buildtree/cmd/protocol-probe/scene_transition.go
          grep -F 'REENTRY-EXIT-DRAIN A/B discriminator' buildtree/cmd/protocol-probe/scene_transition.go

      - name: Restore exact external modules
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          sed -i '/^replace /d' go.mod
          rm -rf _builddeps
          go mod edit -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod download
          go mod download github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0

      - name: Compile and dependency-free checks
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          go test -c -o ../stage37-builtin-ident-contract.test ./cmd/protocol-probe
          go test ./internal/clientdata -count=1

      - name: Focused bag contract tests
        shell: bash
        working-directory: buildtree
        run: |
          set -uo pipefail
          set +e
          go test ./cmd/protocol-probe -run 'TestLatestClientCurrentBagContainers|TestLatestClientCurrentBagRichObjectOrdinalsAreAppendOnly|TestLatestClientCurrentBagFramesAtomicRichObject|TestLatestClientBagWirePropertiesUsesRichCurrentObjectContract|TestLatestClientBagWirePropertiesRecoversWeaponNestedConfigID|TestServerDeleteViewCompatVerifiedLayout|TestLatestClientGMPanelStillExposesGiveItem' -count=1 2>&1 | tee ../TARGETED_TEST.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'TARGETED_RUNTIME_TEST=PASS' | tee ../TEST_BOUNDARY.txt
          elif grep -Fq 'resources/modern/share/skill/skill_new.ini: no such file or directory' ../TARGETED_TEST.txt; then
            echo 'TARGETED_RUNTIME_TEST=BLOCKED_BY_MISSING_SKILL_RESOURCE_IN_STAGE37_HANDOFF' | tee ../TEST_BOUNDARY.txt
          else
            echo "TARGETED_RUNTIME_TEST=FAIL rc=$rc" | tee ../TEST_BOUNDARY.txt
            exit "$rc"
          fi

      - name: Vet reconstructed tree
        shell: bash
        working-directory: buildtree
        run: go vet ./...

      - name: Build Windows amd64 contract test server
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../stage37-live-server.exe ./cmd/protocol-probe
          sha256sum ../stage37-live-server.exe | tee ../stage37-live-server.sha256
          file ../stage37-live-server.exe | tee ../stage37-live-server.file.txt
          go version -m ../stage37-live-server.exe | tee ../stage37-live-server.goversion.txt
          printf '%s\n' \
            'STAGE37 CURRENT-CLIENT BUILT-IN IDENT CONTRACT TEST' \
            '' \
            'Static client contract established before this build:' \
            '- canonical tool bag: ViewID category 1 -> viewport 2' \
            '- VIEW_ADD.objectIndex remains the Stage37 bag slot' \
            '- FxNet2 derives built-in read-only Ident from decimal(objectIndex)' \
            '- historical 0x0765 UniqueID is NOT mapped to current-client Ident' \
            '- original negotiated ordinals 0..227 unchanged' \
            '- ViewID/int32 is the only appended property at ordinal 228' \
            '- total negotiated property count: 229' \
            '- bag row wire: ConfigID(7/105), Amount(106), MaxAmount(110), ItemType(205), ViewID(228)' \
            '- no Ident ordinal 229 is negotiated or emitted' \
            '' \
            'This build passing compile/static tests is NOT a claim of LIVE success.' \
            > ../README_CONTRACT.txt

      - name: Export source evidence
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo '===== scene property tail ====='
            awk '/func sceneVisiblePropertyFields\(/,/^}/' buildtree/cmd/protocol-probe/main.go | tail -50
            echo '===== current bag helper ====='
            cat buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go
            echo '===== bag normalizer ====='
            cat buildtree/cmd/protocol-probe/latest_client_bag_view_ordinal_compat.go
          } > SOURCE_EVIDENCE.txt

      - name: Upload verified contract build
        uses: actions/upload-artifact@v4
        with:
          name: stage37-current-client-builtin-ident-contract
          retention-days: 7
          path: |
            stage37-live-server.exe
            stage37-live-server.sha256
            stage37-live-server.file.txt
            stage37-live-server.goversion.txt
            README_CONTRACT.txt
            TARGETED_TEST.txt
            TEST_BOUNDARY.txt
            SOURCE_EVIDENCE.txt
