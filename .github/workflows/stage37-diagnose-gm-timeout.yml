name: Stage37 Diagnose GM Timeout Source

on:
  push:
    branches: [stage37]
    paths:
      - '.github/workflows/stage37-diagnose-gm-timeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact Stage37 handoff
        shell: bash
        run: |
          set -euxo pipefail
          cat JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part00 JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part01 > handoff.zip
          echo '56a49fa0abb9b4aa6192a9e2d93f7e780c29e585cf11ccb3ff0cf9f398955fdb  handoff.zip' | sha256sum -c -
          unzip -q handoff.zip -d handoff
          mkdir buildtree
          tar -xzf handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz -C buildtree
      - name: Locate GM confirmation timeout source
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== popup string ==='
          grep -R -n -B20 -A30 'game session did not confirm the frame send' buildtree/cmd/protocol-probe || true
          echo '=== two-second expressions ==='
          grep -R -n -E -B5 -A5 '2[[:space:]]*\*[[:space:]]*time\.Second|2000[[:space:]]*\*[[:space:]]*time\.Millisecond|time\.(After|NewTimer)' buildtree/cmd/protocol-probe || true
