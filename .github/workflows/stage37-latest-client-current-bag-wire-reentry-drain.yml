name: Stage37 Latest Client Current Bag Wire + Reentry Drain A/B

on:
  push:
    branches: [stage37]
    paths:
      - 'tools/stage37_latest_client_current_bag_wire_reentry_drain_patch.py'
      - '.github/workflows/stage37-latest-client-current-bag-wire-reentry-drain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Reassemble exact Stage37 handoff
        shell: bash
        run: |
          set -euxo pipefail
          cat JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part00 JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part01 > handoff.zip
          echo '56a49fa0abb9b4aa6192a9e2d93f7e780c29e585cf11ccb3ff0cf9f398955fdb  handoff.zip' | sha256sum -c -
          unzip -q handoff.zip -d handoff
          mkdir buildtree
          tar -xzf handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz -C buildtree
      - name: Apply exact reconstruction and LIVE-proven overlays plus current-client wire probe
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/stage37_authority_compile_patch.py buildtree
          python3 tools/stage37_authority_test_patch.py buildtree
          python3 tools/stage37_authority_test_followup.py buildtree
          python3 tools/stage37_authority_runtime_patch.py buildtree
          base64 -d tools/stage37_authority_resource_test_patch.py.gz.b64 | gzip -dc > /tmp/rp.py
          echo '2a6cbcf3e7c7b6087f0eecc24b09375abcd3559614bbafca12806a8c147aeeb8  /tmp/rp.py' | sha256sum -c -
          python3 /tmp/rp.py buildtree
          base64 -d tools/stage37_authority_resource_test_followup.py.gz.b64 | gzip -dc > /tmp/rf.py
          echo '826fe3feefbadffb3b6c8f75a1d5f74a19c956d38b2294c1ba98996c96fcfec7  /tmp/rf.py' | sha256sum -c -
          python3 /tmp/rf.py buildtree
          python3 tools/stage37_authority_resource_test_final.py buildtree
          python3 tools/stage37_authority_yihua_exact_test_patch.py buildtree
          python3 tools/stage37_latest_client_scene_compat_patch.py buildtree
          python3 tools/stage37_latest_client_player_location_compat_patch.py buildtree
          python3 tools/stage37_latest_client_legacy_born02_remap_patch.py buildtree
          python3 tools/stage37_latest_client_player_property_ordinal_patch.py buildtree
          python3 tools/stage37_latest_client_bag_view_ordinal_patch.py buildtree
          python3 tools/stage37_latest_client_bag_refresh_reentry_sync_patch.py buildtree
          python3 tools/stage37_latest_client_current_bag_wire_reentry_drain_patch.py buildtree
          find buildtree/cmd buildtree/internal -name '*.go' -print0 | xargs -0 gofmt -w
          grep -F 'latest-client CURRENT-BAG item=' buildtree/cmd/protocol-probe/zz_recovered_overlay.go
          grep -F 'latestClientViewAddSingle' buildtree/cmd/protocol-probe/latest_client_current_bag_wire.go
          grep -F 'ViewID", Type: clientdata.WireInt32' buildtree/cmd/protocol-probe/main.go
          grep -F 'REENTRY-EXIT-DRAIN A/B discriminator' buildtree/cmd/protocol-probe/scene_transition.go
          if grep -Fq 'promoted later target-scene 0x0A' buildtree/cmd/protocol-probe/main.go; then echo 'unexpected disproven late-0x0A promotion overlay present'; exit 1; fi
      - name: Restore exact external modules
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          sed -i '/^replace /d' go.mod
          rm -rf _builddeps
          go mod edit -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod download
          go mod download github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
      - name: Compile and dependency-free tests
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          go test -c -o ../stage37-current-bag-wire-reentry-drain.test ./cmd/protocol-probe
          go test ./internal/clientdata -count=1
      - name: Probe targeted runtime boundary
        shell: bash
        working-directory: buildtree
        run: |
          set -uo pipefail
          set +e
          go test ./cmd/protocol-probe -run 'TestLatestClientCurrentBagContainers|TestLatestClientCurrentBagViewIDIsAppendOnlyOrdinal228|TestLatestClientViewAddSingleExactLayout|TestLatestClientViewObjectPropertySingleExactLayout|TestLatestClientCurrentBagFramesStartsWithViewIDThenIdentityCount|TestServerDeleteViewCompatVerifiedLayout|TestLatestClientGMPanelStillExposesGiveItem' -count=1 2>&1 | tee ../TARGETED_TEST.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'TARGETED_RUNTIME_TEST=PASS' | tee ../TEST_BOUNDARY.txt
          elif grep -Fq 'resources/modern/share/skill/skill_new.ini: no such file or directory' ../TARGETED_TEST.txt; then
            echo 'TARGETED_RUNTIME_TEST=BLOCKED_BY_MISSING_SKILL_RESOURCE_IN_STAGE37_HANDOFF' | tee ../TEST_BOUNDARY.txt
          else
            echo "TARGETED_RUNTIME_TEST=FAIL rc=$rc" | tee ../TEST_BOUNDARY.txt
            exit "$rc"
          fi
      - name: Vet reconstructed tree
        shell: bash
        working-directory: buildtree
        run: go vet ./...
      - name: Build Windows amd64 A/B EXE
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../stage37-live-server.exe ./cmd/protocol-probe
          sha256sum ../stage37-live-server.exe | tee ../stage37-live-server.sha256
          file ../stage37-live-server.exe | tee ../stage37-live-server.file.txt
          go version -m ../stage37-live-server.exe | tee ../stage37-live-server.goversion.txt
          printf '%s\n' \
            'STAGE37 LATEST-CLIENT CURRENT BAG SINGLE-PROPERTY WIRE + REENTRY EXIT-DRAIN A/B - NOT EXACT AUTHORITY EXE' \
            '' \
            'Preserves LIVE-proven player ordinal/materialization, movement, NPC ServerLocation replay and born02 remap.' \
            'Current bag container contract: 174 tool, 176 equip, 178 material, 180 task; ViewID remains category 1..4.' \
            'Current FxNet2 VIEW_ADD and view-object property packets carry one property per packet; this probe stops using the reconstructed count-batch shape for persisted bag rows.' \
            'ViewID/int32 is append-only in the negotiated property table at ordinal 228; previous player ordinals are unchanged.' \
            'Scene switch uses 2750ms ExitScene->EntryScene only as an A/B timing discriminator and still waits for a genuine target ClientReady.' \
            'The disproven late-0x0A promotion is intentionally NOT applied.' \
            > ../README_AB.txt
      - name: Upload A/B build
        uses: actions/upload-artifact@v4
        with:
          name: stage37-latest-client-current-bag-wire-reentry-drain-ab
          retention-days: 7
          path: |
            stage37-live-server.exe
            stage37-live-server.sha256
            stage37-live-server.file.txt
            stage37-live-server.goversion.txt
            README_AB.txt
            TARGETED_TEST.txt
            TEST_BOUNDARY.txt
