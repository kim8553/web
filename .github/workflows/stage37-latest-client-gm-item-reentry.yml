name: Stage37 Latest Client GM Item + Reentry A/B

on:
  push:
    branches: [stage37]
    paths:
      - 'tools/stage37_latest_client_gm_item_reentry_patch.py'
      - '.github/workflows/stage37-latest-client-gm-item-reentry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Reassemble exact Stage37 handoff
        shell: bash
        run: |
          set -euxo pipefail
          cat JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part00 JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part01 > handoff.zip
          echo '56a49fa0abb9b4aa6192a9e2d93f7e780c29e585cf11ccb3ff0cf9f398955fdb  handoff.zip' | sha256sum -c -
          unzip -q handoff.zip -d handoff
          mkdir buildtree
          tar -xzf handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz -C buildtree

      - name: Apply exact reconstruction and all LIVE-proven latest-client overlays
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/stage37_authority_compile_patch.py buildtree
          python3 tools/stage37_authority_test_patch.py buildtree
          python3 tools/stage37_authority_test_followup.py buildtree
          python3 tools/stage37_authority_runtime_patch.py buildtree
          base64 -d tools/stage37_authority_resource_test_patch.py.gz.b64 | gzip -dc > /tmp/resource_patch.py
          echo '2a6cbcf3e7c7b6087f0eecc24b09375abcd3559614bbafca12806a8c147aeeb8  /tmp/resource_patch.py' | sha256sum -c -
          python3 /tmp/resource_patch.py buildtree
          base64 -d tools/stage37_authority_resource_test_followup.py.gz.b64 | gzip -dc > /tmp/resource_followup.py
          echo '826fe3feefbadffb3b6c8f75a1d5f74a19c956d38b2294c1ba98996c96fcfec7  /tmp/resource_followup.py' | sha256sum -c -
          python3 /tmp/resource_followup.py buildtree
          python3 tools/stage37_authority_resource_test_final.py buildtree
          python3 tools/stage37_authority_yihua_exact_test_patch.py buildtree
          python3 tools/stage37_latest_client_scene_compat_patch.py buildtree
          python3 tools/stage37_latest_client_player_location_compat_patch.py buildtree
          python3 tools/stage37_latest_client_legacy_born02_remap_patch.py buildtree
          python3 tools/stage37_latest_client_player_property_ordinal_patch.py buildtree
          python3 tools/stage37_latest_client_bag_view_ordinal_patch.py buildtree
          python3 tools/stage37_latest_client_gm_item_reentry_patch.py buildtree
          find buildtree/cmd buildtree/internal -name '*.go' -print0 | xargs -0 gofmt -w
          grep -F "action:'give_item'" buildtree/cmd/protocol-probe/gm_panel.go
          grep -F 'promoted target-scene 0x0A to latest-client stable re-entry ready' buildtree/cmd/protocol-probe/main.go

      - name: Restore exact external modules
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          sed -i '/^replace /d' go.mod
          rm -rf _builddeps
          go mod edit -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod download
          go mod download github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0

      - name: Compile and dependency-free tests
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          go test -c -o ../stage37-gm-item-reentry.test ./cmd/protocol-probe
          go test ./internal/clientdata -count=1

      - name: Probe targeted runtime test boundary
        shell: bash
        working-directory: buildtree
        run: |
          set -uo pipefail
          set +e
          go test ./cmd/protocol-probe -run 'TestLatestClientGMPanelExposesGiveItem' -count=1 2>&1 | tee ../GM_ITEM_REENTRY_TARGETED_TEST.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'TARGETED_RUNTIME_TEST=PASS' | tee ../GM_ITEM_REENTRY_TEST_BOUNDARY.txt
          elif grep -Fq 'resources/modern/share/skill/skill_new.ini: no such file or directory' ../GM_ITEM_REENTRY_TARGETED_TEST.txt; then
            echo 'TARGETED_RUNTIME_TEST=BLOCKED_BY_MISSING_SKILL_RESOURCE_IN_STAGE37_HANDOFF' | tee ../GM_ITEM_REENTRY_TEST_BOUNDARY.txt
          else
            echo "TARGETED_RUNTIME_TEST=FAIL rc=$rc" | tee ../GM_ITEM_REENTRY_TEST_BOUNDARY.txt
            exit "$rc"
          fi

      - name: Vet reconstructed tree
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          go vet ./...

      - name: Build Windows amd64 A/B EXE
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ../stage37-live-server.exe ./cmd/protocol-probe
          sha256sum ../stage37-live-server.exe | tee ../stage37-live-server.sha256
          file ../stage37-live-server.exe | tee ../stage37-live-server.file.txt
          go version -m ../stage37-live-server.exe | tee ../stage37-live-server.goversion.txt
          printf '%s\n' \
            'STAGE37 LATEST-CLIENT GM ITEM + REENTRY A/B - NOT EXACT AUTHORITY EXE' \
            '' \
            'Preserves the LIVE-proven player ordinal, movement, scene compatibility, born02 remap and bag-view ordinal overlays.' \
            'Adds a visible item-grant section to the localhost GM panel using the already-existing give_item API.' \
            'Promotes target-scene 0x0A to the same stable re-entry completion sequence as the existing 0x09 path.' \
            '' \
            'LIVE TEST:' \
            '1. Login: confirm no Lua popup and movement.' \
            '2. Open GM page: confirm item-grant section is visible.' \
            '3. Give Game_item_hp_001 x5 and check bag.' \
            '4. Click one GM scene preset and check whether black screen completes into the target map.' \
            '5. Collect LIVE_RESULT.' \
            > ../README_GM_ITEM_REENTRY_AB.txt

      - name: Upload A/B build
        uses: actions/upload-artifact@v4
        with:
          name: stage37-latest-client-gm-item-reentry-ab
          retention-days: 7
          path: |
            stage37-live-server.exe
            stage37-live-server.sha256
            stage37-live-server.file.txt
            stage37-live-server.goversion.txt
            README_GM_ITEM_REENTRY_AB.txt
            GM_ITEM_REENTRY_TARGETED_TEST.txt
            GM_ITEM_REENTRY_TEST_BOUNDARY.txt
