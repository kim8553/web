name: Stage37 Latest Client Property Diagnostic

on:
  push:
    branches: [stage37]
    paths:
      - '.github/workflows/stage37-latest-client-property-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-property-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Reassemble exact Stage37 handoff
        shell: bash
        run: |
          set -euxo pipefail
          cat JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part00 JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip.part01 > JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip
          echo '56a49fa0abb9b4aa6192a9e2d93f7e780c29e585cf11ccb3ff0cf9f398955fdb  JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip' | sha256sum -c -
          unzip -q JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913.zip -d handoff
          mkdir -p buildtree
          tar -xzf handoff/JIUYIN_STAGE37_BUILDPROBE_HANDOFF_20260913/buildprobe_global_merged4.tar.gz -C buildtree

      - name: Apply exact authority reconstruction and current proven compatibility overlays
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/stage37_authority_compile_patch.py buildtree
          python3 tools/stage37_authority_test_patch.py buildtree
          python3 tools/stage37_authority_test_followup.py buildtree
          python3 tools/stage37_authority_runtime_patch.py buildtree
          base64 -d tools/stage37_authority_resource_test_patch.py.gz.b64 | gzip -dc > /tmp/resource_patch.py
          echo '2a6cbcf3e7c7b6087f0eecc24b09375abcd3559614bbafca12806a8c147aeeb8  /tmp/resource_patch.py' | sha256sum -c -
          python3 /tmp/resource_patch.py buildtree
          base64 -d tools/stage37_authority_resource_test_followup.py.gz.b64 | gzip -dc > /tmp/resource_followup.py
          echo '826fe3feefbadffb3b6c8f75a1d5f74a19c956d38b2294c1ba98996c96fcfec7  /tmp/resource_followup.py' | sha256sum -c -
          python3 /tmp/resource_followup.py buildtree
          python3 tools/stage37_authority_resource_test_final.py buildtree
          python3 tools/stage37_authority_yihua_exact_test_patch.py buildtree
          python3 tools/stage37_latest_client_scene_compat_patch.py buildtree
          python3 tools/stage37_latest_client_player_location_compat_patch.py buildtree
          python3 tools/stage37_latest_client_legacy_born02_remap_patch.py buildtree
          find buildtree/cmd buildtree/internal -name '*.go' -print0 | xargs -0 gofmt -w

      - name: Dump exact reconstructed property and spawn code
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('buildtree')
          out = []

          def add(s=''):
              out.append(s)

          def extract_func(path, name):
              text = path.read_text(encoding='utf-8')
              m = re.search(r'(?m)^func\s+(?:\([^\n]+\)\s+)?'+re.escape(name)+r'\s*\(', text)
              if not m:
                  add(f'FUNCTION_NOT_FOUND {path}:{name}')
                  return
              start = m.start()
              brace = text.find('{', m.end())
              if brace < 0:
                  add(f'FUNCTION_NO_BRACE {path}:{name}')
                  return
              depth = 0
              i = brace
              in_str = None
              esc = False
              while i < len(text):
                  c = text[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == in_str:
                          in_str = None
                  else:
                      if c in ('"', "'", '`'):
                          in_str = c
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              i += 1
                              break
                  i += 1
              add(f'===== {path}:{name} =====')
              add(text[start:i])

          main = root/'cmd'/'protocol-probe'/'main.go'
          for name in [
              'visiblePropertyTable','sceneVisiblePropertyFields','sendPlayerSpawn',
              'serverCreateView','serverViewAdd','sceneObjectByteProperty',
              'sceneObjectStringProperty','sceneObjectObjectProperty'
          ]:
              extract_func(main, name)

          # Find all clientdata source files and every FieldSpec/property-table definition.
          add('===== INTERNAL CLIENTDATA FILES =====')
          for p in sorted((root/'internal'/'clientdata').glob('*.go')):
              add(str(p))
              txt = p.read_text(encoding='utf-8')
              if any(k in txt for k in ['FieldSpec','VisibleNPC','Property','WireInt64']):
                  add(txt)

          # Extract every literal log/source line that mentions the negotiated table count.
          add('===== PROPERTY TABLE CALL SITES =====')
          for p in sorted(root.rglob('*.go')):
              txt = p.read_text(encoding='utf-8')
              for n,line in enumerate(txt.splitlines(),1):
                  if ('property table' in line.lower() or 'visiblePropertyTable' in line or
                      'sceneVisiblePropertyFields' in line or 'ServerAddObject' in line and 'property' in line):
                      add(f'{p}:{n}:{line}')

          Path('PROPERTY_DIAGNOSTIC.txt').write_text('\n'.join(out), encoding='utf-8')
          print('\n'.join(out[:12000]))
          PY

      - name: Verify reconstructed tree still compiles
        shell: bash
        working-directory: buildtree
        run: |
          set -euxo pipefail
          sed -i '/^replace /d' go.mod
          rm -rf _builddeps
          go mod edit -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod download
          go test ./cmd/protocol-probe
          go vet ./cmd/protocol-probe

      - name: Upload diagnostic text
        uses: actions/upload-artifact@v4
        with:
          name: stage37-latest-client-property-diagnostic
          retention-days: 7
          path: PROPERTY_DIAGNOSTIC.txt
