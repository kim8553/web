name: Stage37 NPC ordinary-buy Windows live verification kit
on:
  push:
    branches: [stage37-restored-20260918]
    paths: [.github/workflows/stage37-npc-buy-live-kit-698c0df.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win64-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: shopci_root_only
          MYSQL_DATABASE: shop_atomic_ci
          MYSQL_USER: shopci
          MYSQL_PASSWORD: shopci_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pshopci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Pin original shop gameplay source; keep previous launcher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object server/cmd/protocol-probe/zz_recovered_overlay.go)" = 'a249c70c92ff4c476ada08016ddac80deccd3d63'
          test -f 'server/启动本地九阴服务.bat'
          test -f server/loopback-lister.ps1
          echo "SHOP_LIVE_KIT_SOURCE=PASS workflow_head=$(git rev-parse HEAD) gameplay_blob=a249c70c92ff4c476ada08016ddac80deccd3d63"
      - name: Test disposable MySQL and existing purchase paths; vet; compile Windows x64
        shell: bash
        working-directory: server
        env:
          JIUYIN_TEST_SHOP_MYSQL_DSN: 'shopci:shopci_pw@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true'
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for module in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$module"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cmd/protocol-probe/skill_catalog.go')
          s=p.read_text()
          old='var installedCombatSkillCatalog = mustLoadCombatSkillCatalog()'
          if s.count(old)!=1: raise SystemExit('Unrecognized skill initializer')
          p.write_text(s.replace(old,'var installedCombatSkillCatalog = &combatSkillCatalog{levelOne: make(map[string]combatSkillDefinition)}',1))
          PY
          JIUYIN_TEST_SHOP_MYSQL_CI=1 go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShopDualConflictResyncRealMySQL$' ./cmd/protocol-probe
          JIUYIN_TEST_SHOP_MYSQL_CI=0 go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShop(DualConflict|BagConflict|WalletConflict|PurchaseReentry)' ./cmd/protocol-probe
          git restore -- cmd/protocol-probe/skill_catalog.go
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          JIUYIN_TEST_SHOP_MYSQL_CI=0 go test -modfile=ci.real.mod -count=1 ./internal/shopbuyatomic
          go vet -modfile=ci.real.mod ./...
          mkdir -p ../stage37-npc-buy-live-kit
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -modfile=ci.real.mod -o ../stage37-npc-buy-live-kit/9yin-game-native-menu.exe ./cmd/protocol-probe
          file ../stage37-npc-buy-live-kit/9yin-game-native-menu.exe | grep -E 'PE32\+ executable.*x86-64'
          test "$(git hash-object cmd/protocol-probe/zz_recovered_overlay.go)" = 'a249c70c92ff4c476ada08016ddac80deccd3d63'
          git diff --exit-code -- cmd/protocol-probe/zz_recovered_overlay.go cmd/protocol-probe/skill_catalog.go
          echo 'SHOP_LIVE_KIT=PASS MYSQL_CI=PASS VET=PASS WINDOWS_BUILD=PASS USER_MYSQL=NOT_RUN CLIENT_LIVE=NOT_RUN'
      - name: Package verified binary, checksum, and safe local test guide
        shell: bash
        run: |
          set -euo pipefail
          cd stage37-npc-buy-live-kit
          sha256sum 9yin-game-native-menu.exe > SHA256SUMS.txt
          {
            echo 'Repository: https://github.com/kim8553/web'
            echo 'Branch: stage37-restored-20260918'
            echo 'Last gameplay fix: 698c0df44e2201b91aa7dc7f5f4510171bf1bb96'
            echo "Exact build commit: $(git -C .. rev-parse HEAD)"
            echo 'Shop gameplay blob: a249c70c92ff4c476ada08016ddac80deccd3d63'
            echo "Compiler: $(go version)"
            echo 'Target: Windows amd64 / CGO disabled'
            echo 'Disposable CI tests and vet: PASS; user MySQL and real client E2E: NOT RUN'
            echo 'Client, resources, database, personal files: NOT INCLUDED'
          } > BUILD_PROVENANCE.txt
          cat > READ_FIRST_KO.txt <<'EOF'
          구음진경 NPC 일반 상점 구매 확인용 Windows x64 서버 EXE입니다. 완성 서버 통합 패키지는 아닙니다.
          클라이언트/DLL/resources/DB/캐릭터 데이터는 포함하지 않으며, 사용자 PC 게임 검증은 아직 실행하지 않았습니다.

          1. 기존 서버를 정상 종료하고 서버 폴더와 MySQL DB를 먼저 백업하세요.
          2. 기존 서버 폴더에 启动本地九阴服务.bat, loopback-lister.ps1, resources\modern\share, data\roles.json이 실제 있는지 확인하세요.
             없으면 구버전 자료나 가짜 파일로 채우지 마세요.
          3. 기존 서버 폴더의 9yin-game-native-menu.exe를 백업하고 ZIP 안의 동명 EXE만 그 자리에 복사하세요.
             resources/data/DB/DLL이나 다른 실행 파일을 덮어쓰지 마세요. 같은 서버 두 개를 동시에 실행하지 마세요.
          4. PowerShell의 Get-FileHash .\9yin-game-native-menu.exe -Algorithm SHA256 결과를 SHA256SUMS.txt와 비교하세요.
          5. 기존 启动本地九阴服务.bat로 실행하세요. 기존 스크립트의 게임 19061 / GM 19062 설정을 그대로 사용합니다.
          6. 최신 클라이언트로 접속해 일반 NPC 상점의 일반 가격 상품 한 개를 딱 한 번 구매하세요.
             전/후 아이템 수량·가방 슬롯·재화 잔액을 기록하고, 실패 시 같은 구매를 반복하지 마세요.
          7. 정상 로그아웃 후 재접속해 위 세 항목을 비교하세요. 문제가 있다면 실패 단계와 비식별화한 로그·화면을 공유하세요.
             기존 배치 파일의 로그 대상은 logs\protocol-probe-live.log, logs\game-19061.current.log입니다. 실제 생성 여부를 확인하세요.

          CI 빌드/테스트 성공은 실제 최신 클라이언트 구매·재접속 성공이 아닙니다.
          NPC 판매, GM 아이템 지급, 아이템 교환은 테스트 범위가 아닙니다.
          EOF
          test -s SHA256SUMS.txt && test -s BUILD_PROVENANCE.txt && test -s READ_FIRST_KO.txt
          echo 'SHOP_LIVE_KIT_CONTENTS=PASS'
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-npc-buy-win64-kit-698c0df
          path: stage37-npc-buy-live-kit/
          if-no-files-found: error
          retention-days: 7
