name: Stage37 NPC Shop Join Offline Audit

on:
  push:
    branches:
      - stage37-current-recovery-20260916
    paths:
      - tools/stage37_npc_shop_join_audit.py
      - tests/test_stage37_npc_shop_join_audit.py
      - .github/workflows/stage37-npc-shop-join-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-npc-shop-join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
      - name: Syntax check of committed files
        run: python3 -m py_compile tools/stage37_npc_shop_join_audit.py tests/test_stage37_npc_shop_join_audit.py
      - name: Read-only synthetic fixtures only (no private Drive or DB)
        run: python3 -m unittest discover -s tests -p 'test_stage37_npc_shop_join_audit.py' -v
      - name: Verify not promoted to production or LIVE
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('audit',Path('tools/stage37_npc_shop_join_audit.py'))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          npc=(b'NPC\tSHOP\nSTRING\tSTRING\nID\tShopID\n\t\n\t\n'
               b'N1\tS1\n')
          shop=b'[S1]\n0=item,1,3,1,0,0,0,0,,\n'
          result=module.audit(npc,shop,'N1')
          assert result['requested_npc']['status']=='NO_NORMAL_MODE_ITEM_ADD_FRAMES'
          assert result['live_e2e_verified'] is False
          assert result['production_handler_enabled'] is False
          assert result['legacy_0x46_selector_verified'] is False
          print('offline_only=PASS; windows_build=NOT_RUN; live_e2e=NOT_RUN')
          PY
