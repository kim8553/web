name: Stage37 restored shop bag snapshot conflict guard
on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - '.github/workflows/stage37-restored-shop-bag-guard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: shopci_root_only
          MYSQL_DATABASE: shop_atomic_ci
          MYSQL_USER: shopci
          MYSQL_PASSWORD: shopci_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pshopci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply source-locked normal purchase patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = stage37-restored-20260918
          python3 tools/stage37_shop_bag_guard_apply.py
          gofmt -w server/internal/shopbuyatomic/checked.go server/internal/shopbuyatomic/checked_bag_test.go server/internal/shopbuyatomic/checked_mysql_integration_test.go server/cmd/protocol-probe/shop_purchase_atomic.go
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'server/cmd/protocol-probe/zz_recovered_overlay.go','server/cmd/protocol-probe/shop_purchase_atomic.go','server/internal/shopbuyatomic/checked.go','server/internal/shopbuyatomic/checked_bag_test.go','server/internal/shopbuyatomic/checked_mysql_integration_test.go'}
          if 'server/cmd/protocol-probe/zz_recovered_overlay.go' not in changed or not changed <= allowed:
              raise SystemExit(f'UNEXPECTED_CHANGED_PATHS={changed}')
          print('SHOP_BAG_GUARD_SCOPE=PASS')
          PY
      - name: Resolve real dependencies only in temporary modfile
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          go mod download -modfile=ci.real.mod
      - name: Verify disposable MySQL bag conflict, Go tests, vet and Windows build
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          JIUYIN_TEST_SHOP_MYSQL_CI=1 JIUYIN_TEST_SHOP_MYSQL_DSN='shopci:shopci_pw@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true' go test -modfile=ci.real.mod -count=1 -v ./internal/shopbuyatomic
          mapfile -t pkgs < <(go list -modfile=ci.real.mod ./... | grep -v '^github.com/local/9yin-go-server/cmd/protocol-probe$')
          go test -modfile=ci.real.mod -count=1 "${pkgs[@]}"
          go test -modfile=ci.real.mod -c -o /tmp/stage37-shop-bag-guard.test ./cmd/protocol-probe
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -modfile=ci.real.mod -o /tmp/stage37-shop-bag-guard.exe ./cmd/protocol-probe
          file /tmp/stage37-shop-bag-guard.exe | grep -E 'PE32\+ executable.*x86-64'
          echo 'DISPOSABLE_MYSQL_BAG_CONFLICT=PASS SQLMOCK_BAG_CONFLICT=PASS NON_PROTOCOL=PASS PROTOCOL_COMPILE=PASS VET=PASS WINDOWS_BUILD=PASS USER_MYSQL=NOT_RUN CLIENT_LIVE_E2E=NOT_RUN'
      - name: Commit only verified purchase source, no force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/cmd/protocol-probe/zz_recovered_overlay.go server/cmd/protocol-probe/shop_purchase_atomic.go server/internal/shopbuyatomic/checked.go server/internal/shopbuyatomic/checked_bag_test.go server/internal/shopbuyatomic/checked_mysql_integration_test.go
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          allowed={'server/cmd/protocol-probe/zz_recovered_overlay.go','server/cmd/protocol-probe/shop_purchase_atomic.go','server/internal/shopbuyatomic/checked.go','server/internal/shopbuyatomic/checked_bag_test.go','server/internal/shopbuyatomic/checked_mysql_integration_test.go'}
          if 'server/cmd/protocol-probe/zz_recovered_overlay.go' not in changed or not changed <= allowed:
              raise SystemExit(f'UNEXPECTED_STAGED_PATHS={changed}')
          PY
          git commit -m 'fix(shop): reject stale-bag purchases before atomic commit'
          git push origin HEAD:refs/heads/stage37-restored-20260918
          echo "SHOP_BAG_GUARD_COMMIT=$(git rev-parse HEAD)"
