name: Stage37 restored shop safety verification
on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - 'server/**'
      - '.github/workflows/stage37-restored-shop-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shop-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Resolve actual modules without rewriting project dependencies
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          go mod download -modfile=ci.real.mod
          test -z "$(gofmt -l cmd/protocol-probe/shop_catalog.go cmd/protocol-probe/shop_catalog_input_validation_test.go cmd/protocol-probe/shop_catalog_duplicate_position_test.go)"
      - name: Test exact shop parser in isolated package (no private resources)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage37-shop-parser-test
          cp cmd/protocol-probe/shop_catalog.go cmd/protocol-probe/shop_catalog_input_validation_test.go cmd/protocol-probe/shop_catalog_duplicate_position_test.go /tmp/stage37-shop-parser-test/
          printf 'package main\nconst defaultModernShareRoot = ""\n' > /tmp/stage37-shop-parser-test/test_root_stub.go
          cd /tmp/stage37-shop-parser-test
          GO111MODULE=off go test -count=1 -v *.go
          echo 'SHOP_PARSER_ISOLATED=PASS FULL_PROTOCOL_RUNTIME=NOT_RUN'
      - name: Run non-protocol tests, protocol compilation and vet
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list -modfile=ci.real.mod ./... | grep -v '^github.com/local/9yin-go-server/cmd/protocol-probe$')
          go test -modfile=ci.real.mod -count=1 "${pkgs[@]}"
          go test -modfile=ci.real.mod -c -o /tmp/stage37-protocol.test ./cmd/protocol-probe
          go vet -modfile=ci.real.mod ./...
          echo 'NON_PROTOCOL_TESTS=PASS PROTOCOL_COMPILE=PASS VET=PASS'
      - name: Build Windows amd64 server (not a LIVE test)
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -modfile=ci.real.mod -o /tmp/stage37-restored-shop.exe ./cmd/protocol-probe
          file /tmp/stage37-restored-shop.exe | grep -E 'PE32\+ executable.*x86-64'
          sha256sum /tmp/stage37-restored-shop.exe
          echo 'WINDOWS_BUILD=PASS LIVE_E2E=NOT_RUN'
