name: Stage37 shop adjacent bag move checked save
on:
  push:
    branches: [stage37-restored-20260918]
    paths: [.github/workflows/stage37-shop-bag-move-checked.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bag-move:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply audited bag move patch and verify scope
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage37_shop_bag_move_guard_apply.py
          gofmt -w server/cmd/protocol-probe/zz_recovered_overlay.go server/cmd/protocol-probe/shop_bag_move_checked_test.go
          git diff --check
          test "$(git diff --name-only)" = 'server/cmd/protocol-probe/zz_recovered_overlay.go'
          git diff -- server/cmd/protocol-probe/zz_recovered_overlay.go
          echo 'BAG_MOVE_PATCH_SCOPE=PASS'
      - name: Test move swap, stale bag rollback, vet, Windows server build
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          # The focused unit tests do not exercise skills; never commit this
          # temporary bypass of the unrelated private skill_new.ini initializer.
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          python3 - <<'PY'
          from pathlib import Path
          path=Path('cmd/protocol-probe/skill_catalog.go')
          text=path.read_text()
          old='var installedCombatSkillCatalog = mustLoadCombatSkillCatalog()'
          new='var installedCombatSkillCatalog = &combatSkillCatalog{levelOne: make(map[string]combatSkillDefinition)}'
          if text.count(old)!=1:
              raise SystemExit('refuse unexpected skill catalog initializer')
          path.write_text(text.replace(old,new,1))
          PY
          go test -modfile=ci.real.mod -count=1 -v -run '^TestShopAdjacent(BagMoveCrossViewSwapKeepsSourceSlot|BagMoveRejectsStaleBagBeforePublishing|ArrangeRejectsStaleBagBeforePublishing)$' ./cmd/protocol-probe
          git restore -- cmd/protocol-probe/skill_catalog.go
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          go test -modfile=ci.real.mod -count=1 ./internal/shopbuyatomic
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=ci.real.mod -o /tmp/stage37-shop-bag-move.exe ./cmd/protocol-probe
          file /tmp/stage37-shop-bag-move.exe | grep -E 'PE32\+ executable.*x86-64'
          echo 'CROSS_VIEW_SLOT=PASS STALE_MOVE_REJECTION=PASS ARRANGE_REGRESSION=PASS ATOMIC_PACKAGE=PASS VET=PASS WINDOWS_BUILD=PASS CLIENT_LIVE=NOT_RUN USER_MYSQL=NOT_RUN'
      - name: Publish only validated game overlay
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = 'server/cmd/protocol-probe/zz_recovered_overlay.go'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/cmd/protocol-probe/zz_recovered_overlay.go
          test "$(git diff --cached --name-only)" = 'server/cmd/protocol-probe/zz_recovered_overlay.go'
          git commit -m 'fix(shop): persist bag move before frames and retain displaced source slot'
          git push origin HEAD:refs/heads/stage37-restored-20260918
          git rev-parse HEAD
