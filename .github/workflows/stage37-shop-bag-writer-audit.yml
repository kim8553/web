name: Stage37 shop bag writer call site audit
on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - .github/workflows/stage37-shop-bag-writer-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate bag writers and shop sell evidence, without modifying source
        shell: bash
        run: |
          set -euo pipefail
          command -v grep
          echo '=== BAG STORE SAVE CALLS ==='
          grep -R -n -E -C 5 --include='*.go' 'bagStore\.Save\(|persistBagMutationChecked\(|\.Save\(roleID, .*bag|SaveCheckedBag\(|SaveBagChecked\(|LockRoleForBagWrite\(' server/cmd/protocol-probe server/internal/shopbuyatomic || test "$?" -eq 1
          echo '=== BAG MUTATION METHODS AND SHOP SELL ==='
          grep -R -n -E -C 3 --include='*.go' 'takeBagItem\(|decrementBagItem\(|arrangeBagView\(|addBagItem\(|restoreBag\(|handleShopSell|shop sell|shop_sell|SellItem|SellItemToShop' server/cmd/protocol-probe | head -n 500 || test "${PIPESTATUS[0]}" -eq 1
          echo '=== SHOP-RELATED FILENAME LIST ==='
          find server/cmd/protocol-probe server/internal/shopbuyatomic -maxdepth 1 -type f -iname '*shop*' -printf '%p\n' | sort
          echo 'AUDIT_COMMANDS_EXECUTED=PASS SOURCE_CHANGED=NO USER_MYSQL=NOT_RUN CLIENT_LIVE=NOT_RUN'
