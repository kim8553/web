name: Stage37 ordinary NPC purchase changed-wallet concurrency
on:
  push:
    branches: [stage37-restored-20260918]
    paths: [.github/workflows/stage37-shop-changed-wallet-cas.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: shopci_root_only
          MYSQL_DATABASE: shop_atomic_ci
          MYSQL_USER: shopci
          MYSQL_PASSWORD: shopci_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pshopci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Test committed and changed wallets against disposable MySQL
        working-directory: server
        shell: bash
        env:
          JIUYIN_TEST_SHOP_MYSQL_CI: '1'
          JIUYIN_TEST_SHOP_MYSQL_DSN: 'shopci:shopci_pw@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true'
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          # Isolated shop tests only: bypass absent private combat resource,
          # then restore this source before vet and Windows production build.
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          python3 - <<'PY'
          from pathlib import Path
          path=Path('cmd/protocol-probe/skill_catalog.go')
          text=path.read_text()
          old='var installedCombatSkillCatalog = mustLoadCombatSkillCatalog()'
          new='var installedCombatSkillCatalog = &combatSkillCatalog{levelOne: make(map[string]combatSkillDefinition)}'
          if text.count(old)!=1:
              raise SystemExit('unexpected skill catalog initializer; never fabricate skill_new.ini')
          path.write_text(text.replace(old,new,1))
          PY
          go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShop(CommittedWalletSkipsDeferredMySQLOverwrite|ChangedWalletRejectsStaleLogout|DisconnectGuardDoesNotChangeJSONPersistence|PurchaseLogoutPreservesNewerMySQLWallet)$' ./cmd/protocol-probe
          git restore -- cmd/protocol-probe/skill_catalog.go
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          JIUYIN_TEST_SHOP_MYSQL_CI=0 go test -modfile=ci.real.mod -count=1 ./internal/shopbuyatomic
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=ci.real.mod -o /tmp/stage37-shop-wallet-compare-save.exe ./cmd/protocol-probe
          file /tmp/stage37-shop-wallet-compare-save.exe | grep -E 'PE32\+ executable.*x86-64'
          git diff --check
          echo 'PURCHASE_CHANGED_WALLET_CAS=PASS STALE_WALLET=REJECTED FRESH_WALLET=PERSISTED PURCHASE_BAG=PRESERVED JSON_STORE=UNCHANGED VET=PASS WINDOWS_BUILD=PASS USER_MYSQL=NOT_RUN LATEST_CLIENT_LIVE=NOT_RUN'
