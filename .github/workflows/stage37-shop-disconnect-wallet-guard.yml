name: Stage37 NPC purchase disconnect wallet guard
on:
  push:
    branches: [stage37-restored-20260918]
    paths: [.github/workflows/stage37-shop-disconnect-wallet-guard.yml]
permissions:
  contents: write
jobs:
  disconnect-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: shopci_root_only
          MYSQL_DATABASE: shop_atomic_ci
          MYSQL_USER: shopci
          MYSQL_PASSWORD: shopci_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pshopci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply exact purchase-only source edits and verify scope
        run: |
          set -euo pipefail
          python3 tools/stage37_shop_disconnect_wallet_guard_apply.py
          gofmt -w server/cmd/protocol-probe/main.go server/cmd/protocol-probe/player_actor.go server/cmd/protocol-probe/zz_recovered_overlay.go server/cmd/protocol-probe/shop_currency_disconnect_guard.go server/cmd/protocol-probe/shop_currency_disconnect_guard_test.go server/cmd/protocol-probe/shop_currency_disconnect_mysql_test.go
          git diff --check
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          required={f'server/cmd/protocol-probe/{n}' for n in ('main.go','player_actor.go','zz_recovered_overlay.go')}
          permitted=required | {f'server/cmd/protocol-probe/{n}' for n in ('shop_currency_disconnect_guard.go','shop_currency_disconnect_guard_test.go','shop_currency_disconnect_mysql_test.go')}
          if not required.issubset(actual) or not actual.issubset(permitted):
              raise SystemExit(f'UNEXPECTED_CHANGE_SCOPE={actual}')
          print('SHOP_DISCONNECT_WALLET_PATCH_SCOPE=PASS GM_GRANT_UNCHANGED=YES EXCHANGE_UNCHANGED=YES')
          PY
          git diff --stat
      - name: Test isolated purchase and newer wallet, vet and Windows build
        working-directory: server
        shell: bash
        env:
          JIUYIN_TEST_SHOP_MYSQL_CI: '1'
          JIUYIN_TEST_SHOP_MYSQL_DSN: 'shopci:shopci_pw@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true'
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          # Only the focused tests bypass unrelated eager combat catalog loading;
          # do not commit this substitution or fabricate a private skill_new.ini.
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          python3 - <<'PY'
          from pathlib import Path
          path=Path('cmd/protocol-probe/skill_catalog.go')
          original=path.read_text()
          old='var installedCombatSkillCatalog = mustLoadCombatSkillCatalog()'
          replacement='var installedCombatSkillCatalog = &combatSkillCatalog{levelOne: make(map[string]combatSkillDefinition)}'
          if original.count(old)!=1:
              raise SystemExit('unexpected combat catalog initializer')
          path.write_text(original.replace(old,replacement,1))
          PY
          go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShop(CommittedWalletSkipsDeferredMySQLOverwrite|DisconnectGuardDoesNotChangeJSONPersistence|PurchaseLogoutPreservesNewerMySQLWallet)$' ./cmd/protocol-probe
          git restore -- cmd/protocol-probe/skill_catalog.go
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          JIUYIN_TEST_SHOP_MYSQL_CI=0 go test -modfile=ci.real.mod -count=1 ./internal/shopbuyatomic
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=ci.real.mod -o /tmp/ordinary-shop-disconnect-wallet.exe ./cmd/protocol-probe
          file /tmp/ordinary-shop-disconnect-wallet.exe | grep -E 'PE32\+ executable.*x86-64'
          echo 'PURCHASE_WALLET_LOGOUT=PASS INDEPENDENT_MYSQL_NEWER_WALLET=PRESERVED JSON_STORE=UNCHANGED VET=PASS WINDOWS_BUILD=PASS USER_MYSQL=NOT_RUN LATEST_CLIENT_LIVE=NOT_RUN'
      - name: Publish only tested purchase source
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/cmd/protocol-probe/main.go server/cmd/protocol-probe/player_actor.go server/cmd/protocol-probe/zz_recovered_overlay.go server/cmd/protocol-probe/shop_currency_disconnect_guard.go server/cmd/protocol-probe/shop_currency_disconnect_guard_test.go server/cmd/protocol-probe/shop_currency_disconnect_mysql_test.go
          python3 - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          required={f'server/cmd/protocol-probe/{n}' for n in ('main.go','player_actor.go','zz_recovered_overlay.go')}
          permitted=required | {f'server/cmd/protocol-probe/{n}' for n in ('shop_currency_disconnect_guard.go','shop_currency_disconnect_guard_test.go','shop_currency_disconnect_mysql_test.go')}
          if not required.issubset(staged) or not staged.issubset(permitted):
              raise SystemExit(f'REFUSE_STAGE={staged}')
          print('PUBLISH_SCOPE=PASS')
          PY
          git commit -m 'fix(shop): prevent duplicate logout currency save after committed purchase'
          git push origin HEAD:refs/heads/stage37-restored-20260918
          git rev-parse HEAD
