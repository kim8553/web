name: Stage37 legacy bag writer source audit
on:
  push:
    branches: [stage37-restored-20260918]
    paths: [.github/workflows/stage37-shop-legacy-writer-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Print exact bag writer call locations and adjacent source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('server').rglob('*.go'))
          needles = ('.bagStore.Save(', 'bagStore.Save(', '.SaveBag(', 'mysqlBagStore)', 'persistOrdinaryShopPurchase(', 'restoreBag(', 'bagSnapshot()', 'storeBag(', 'persistBag(')
          print('AUDIT_GO_FILES',len(files))
          hits=[]
          for path in files:
              lines=path.read_text(encoding='utf-8').splitlines()
              for idx,line in enumerate(lines):
                  if any(token in line for token in needles):
                      hits.append((path,idx,lines))
          print('AUDIT_HITS',len(hits))
          for path,idx,lines in hits:
              print(f'=== {path}:{idx+1} ===')
              for offset in range(max(0,idx-5),min(len(lines),idx+7)):
                  print(f'{offset+1}: {lines[offset]}')
          PY
