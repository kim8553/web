name: Stage37 ordinary purchase reconnect parity
on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - .github/workflows/stage37-shop-purchase-reentry-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  purchase-reentry-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Test ordinary purchase wire parity without private combat skill data
        shell: bash
        working-directory: server
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          # The real production file is restored before vet/build; this temporary,
          # SHA-locked test-only substitution disables an unrelated eager combat
          # initializer requiring a private skill_new.ini. It does not fabricate
          # client catalog content, and the ordinary shop code remains unchanged.
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          python3 - <<'PY'
          from pathlib import Path
          path=Path('cmd/protocol-probe/skill_catalog.go')
          text=path.read_text()
          old='var installedCombatSkillCatalog = mustLoadCombatSkillCatalog()'
          new='var installedCombatSkillCatalog = &combatSkillCatalog{levelOne: make(map[string]combatSkillDefinition)}'
          if text.count(old)!=1:
              raise SystemExit('unexpected combat initializer; no test-only patch applied')
          path.write_text(text.replace(old,new,1))
          PY
          go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShop(PurchaseFrameMatchesReconnectReplay|WalletFrameMatchesActorReload)$' ./cmd/protocol-probe
          git restore -- cmd/protocol-probe/skill_catalog.go
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=ci.real.mod -o /tmp/shop-purchase-reentry.exe ./cmd/protocol-probe
          file /tmp/shop-purchase-reentry.exe | grep -E 'PE32\+ executable.*x86-64'
          echo 'ORDINARY_SHOP_WIRE_PARITY=PASS COMBAT_INIT=TEST_ONLY_STUB PRODUCTION_COMBAT_SOURCE=RESTORED VET=PASS WINDOWS_BUILD=PASS REAL_CLIENT_LIVE=NOT_RUN USER_MYSQL=NOT_RUN'
