name: Stage37 shop writer lock check
on:
  push:
    branches: [stage37-restored-20260918]
    paths: [.github/workflows/stage37-shop-writer-lock-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: shopci_root_only
          MYSQL_DATABASE: shop_atomic_ci
          MYSQL_USER: shopci
          MYSQL_PASSWORD: shopci_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pshopci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Patch only expected legacy bag store
        run: |
          set -euo pipefail
          python3 tools/stage37_shop_writer_lock_apply.py
          gofmt -w server/cmd/protocol-probe/zz_recovered_overlay.go
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != {'server/cmd/protocol-probe/zz_recovered_overlay.go'}:
              raise SystemExit(f'UNEXPECTED_PATCH_PATHS={changed}')
          print('SHOP_WRITER_LOCK_SCOPE=PASS')
          PY
      - name: Test source against isolated MySQL and compile Windows server
        working-directory: server
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for path in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$path"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          JIUYIN_TEST_SHOP_MYSQL_CI=1 JIUYIN_TEST_SHOP_MYSQL_DSN='shopci:shopci_pw@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true' go test -modfile=ci.real.mod -count=1 -v ./internal/shopbuyatomic
          mapfile -t pkgs < <(go list -modfile=ci.real.mod ./... | grep -v '^github.com/local/9yin-go-server/cmd/protocol-probe$')
          go test -modfile=ci.real.mod -count=1 "${pkgs[@]}"
          go test -modfile=ci.real.mod -c -o /tmp/shop-writer-lock.test ./cmd/protocol-probe
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -modfile=ci.real.mod -o /tmp/shop-writer-lock.exe ./cmd/protocol-probe
          echo 'DISPOSABLE_MYSQL=PASS GO_TEST=PASS PROTOCOL_COMPILE=PASS VET=PASS WINDOWS_BUILD=PASS CLIENT_LIVE=NOT_RUN'
      - name: Publish only tested overlay source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- server/cmd/protocol-probe/zz_recovered_overlay.go
          test "$(git diff --cached --name-only)" = 'server/cmd/protocol-probe/zz_recovered_overlay.go'
          git commit -m 'fix(shop): serialize legacy bag saves with ordinary purchase'
          git push origin HEAD:refs/heads/stage37-restored-20260918
          git rev-parse HEAD
