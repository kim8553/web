name: Stage37 startup resource guard and shop regression
on:
  push:
    branches: [stage37-restored-20260918]
    paths:
      - .github/workflows/stage37-startup-resource-preflight.yml
      - server/verify-runtime-resources.ps1
      - server/启动本地九阴服务.bat
      - server/migrations/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-resource-guard:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse read-only PowerShell preflight
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'server/verify-runtime-resources.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ('PowerShell parser errors: ' + ($errors | Out-String)) }
          Write-Host 'PREFLIGHT_PS_SYNTAX=PASS'
      - name: Nested Windows root detects missing loader files and unset MySQL
        shell: pwsh
        run: |
          $env:NINEYIN_MYSQL_DSN = ''
          $root = Join-Path $env:RUNNER_TEMP '9yin-go-server1/9yin-go-server1'
          [IO.Directory]::CreateDirectory($root) | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE 'server/verify-runtime-resources.ps1'
          $output = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Root $root -RequireMySQL 2>&1 | Out-String)
          $expectedExit = $LASTEXITCODE
          if ($expectedExit -ne 1) { throw "Expected failed preflight: exit=$expectedExit" }
          foreach ($needle in @('RESOURCE_PREFLIGHT=FAIL', 'ini\effect\playerweapon', 'item\equipment.ini', 'NINEYIN_MYSQL_DSN')) {
            if (-not $output.Contains($needle)) { throw "Missing diagnostic: $needle" }
          }
          Write-Host 'MISSING_RESOURCE_AND_DSN_REPRO=PASS'
          exit 0
      - name: Assert launcher checks resources before migration-authorization gate
        shell: pwsh
        run: |
          $launcher = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'server/启动本地九阴服务.bat') -Raw
          $preflight = $launcher.IndexOf('"%PREFLIGHT%" -Root')
          $migration = $launcher.IndexOf('if /I not "%NINEYIN_ALLOW_SCHEMA_MIGRATIONS%"')
          if ($preflight -lt 0 -or $migration -le $preflight) { throw 'Unsafe launcher gating order' }
          foreach ($needle in @('NINEYIN_SERVER_ROOT=%ROOT%', 'mysql.env', 'if not defined NINEYIN_MYSQL_DSN')) {
            if (-not $launcher.Contains($needle)) { throw "Missing launcher setting: $needle" }
          }
          Write-Host 'LAUNCHER_ROOT_DSN_MIGRATION_GATE=PASS'
  isolated-shop-and-win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: shopci_root_only
          MYSQL_DATABASE: shop_atomic_ci
          MYSQL_USER: shopci
          MYSQL_PASSWORD: shopci_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pshopci_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Migration safety, disposable MySQL shop regression, vet and Windows x64 build
        shell: bash
        working-directory: server
        env:
          JIUYIN_TEST_SHOP_MYSQL_DSN: 'shopci:shopci_pw@tcp(127.0.0.1:3306)/shop_atomic_ci?parseTime=true'
        run: |
          set -euo pipefail
          cp go.mod ci.real.mod
          cp go.sum ci.real.sum
          for module in github.com/go-sql-driver/mysql golang.org/x/text filippo.io/edwards25519 github.com/DATA-DOG/go-sqlmock github.com/Hiroko103/go-quicklz; do
            go mod edit -modfile=ci.real.mod -dropreplace="$module"
          done
          go mod edit -modfile=ci.real.mod -require=github.com/Hiroko103/go-quicklz@v0.0.0-20190115215310-59904abc50d0
          go mod tidy -modfile=ci.real.mod
          JIUYIN_TEST_MIGRATION_MYSQL_CI=1 NINEYIN_ALLOW_SCHEMA_MIGRATIONS= go test -modfile=ci.real.mod -count=1 -v ./migrations
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cmd/protocol-probe/skill_catalog.go')
          s=p.read_text()
          old='var installedCombatSkillCatalog = mustLoadCombatSkillCatalog()'
          if s.count(old)!=1: raise SystemExit('Unrecognized skill initializer')
          p.write_text(s.replace(old,'var installedCombatSkillCatalog = &combatSkillCatalog{levelOne: make(map[string]combatSkillDefinition)}',1))
          PY
          JIUYIN_TEST_SHOP_MYSQL_CI=1 go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShopDualConflictResyncRealMySQL$' ./cmd/protocol-probe
          JIUYIN_TEST_SHOP_MYSQL_CI=0 go test -modfile=ci.real.mod -count=1 -v -run '^TestOrdinaryShop(DualConflict|BagConflict|WalletConflict|PurchaseReentry)' ./cmd/protocol-probe
          git restore -- cmd/protocol-probe/skill_catalog.go
          test "$(git hash-object cmd/protocol-probe/skill_catalog.go)" = '0fe5ade5f8f50dc691e2028b1a6246cd312a23db'
          JIUYIN_TEST_SHOP_MYSQL_CI=0 go test -modfile=ci.real.mod -count=1 ./internal/shopbuyatomic
          go vet -modfile=ci.real.mod ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -modfile=ci.real.mod -o "$RUNNER_TEMP/9yin-resource-audit-win64.exe" ./cmd/protocol-probe
          file "$RUNNER_TEMP/9yin-resource-audit-win64.exe" | grep -E 'PE32\+ executable.*x86-64'
          git diff --exit-code -- cmd/protocol-probe/zz_recovered_overlay.go cmd/protocol-probe/skill_catalog.go
          echo 'MIGRATION_READ_ONLY_TESTS=PASS MYSQL_ISOLATED=PASS SHOP_REGRESSION=PASS GO_VET=PASS WIN64_BUILD=PASS SERVER_START=NOT_RUN USER_MYSQL=NOT_RUN CLIENT_LIVE=NOT_RUN'
