name: Stage44 Private Resource Auditor Synthetic Verification

on:
  push:
    branches:
      - stage37-current-recovery-20260916
    paths:
      - 'tools/stage44_resource_loader_audit.go'
      - 'tools/test_stage44_resource_loader_audit.py'
      - '.github/workflows/stage44-private-resource-audit.yml'
  workflow_dispatch:

jobs:
  verify-synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Verify tool compiles and passes vet
        run: |
          go build -o "${RUNNER_TEMP}/stage44-audit" ./tools/stage44_resource_loader_audit.go
          go vet ./tools/stage44_resource_loader_audit.go
      - name: Test synthetic INIs only (no game data)
        run: python3 -m unittest -v tools/test_stage44_resource_loader_audit.py
      - name: Confirm audit boundary
        run: |
          echo 'Only source code and synthetic fixtures were checked.'
          echo 'No private res package, real INI, account data, or client binary is fetched or uploaded.'
