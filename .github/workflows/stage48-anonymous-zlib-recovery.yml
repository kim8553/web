name: Stage48 Anonymous Zlib Recovery (synthetic only)

on:
  push:
    branches:
      - stage37-current-recovery-20260916
    paths:
      - tools/stage48_anonymous_zlib_recovery.py
      - .github/workflows/stage48-anonymous-zlib-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile tools/stage48_anonymous_zlib_recovery.py
      - name: Synthetic zlib and rejection tests only
        run: python tools/stage48_anonymous_zlib_recovery.py --self-test
