name: Stage49 Share Shop Evidence (synthetic only)

on:
  push:
    branches:
      - stage37-current-recovery-20260916
    paths:
      - tools/stage49_share_shop_evidence.py
      - tools/stage48_anonymous_zlib_recovery.py
      - .github/workflows/stage49-share-shop-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax without private files
        run: python -m py_compile tools/stage48_anonymous_zlib_recovery.py tools/stage49_share_shop_evidence.py
      - name: Stage48 bounded zlib synthetic tests
        run: python tools/stage48_anonymous_zlib_recovery.py --self-test
      - name: Stage49 private-evidence handler synthetic tests
        run: python tools/stage49_share_shop_evidence.py --self-test
