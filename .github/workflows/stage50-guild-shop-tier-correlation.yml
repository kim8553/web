name: Stage50 Guild Shop Tier Correlation (synthetic only)

on:
  push:
    branches:
      - stage37-current-recovery-20260916
    paths:
      - tools/stage50_guild_shop_tier_correlation.py
      - tools/stage48_anonymous_zlib_recovery.py
      - .github/workflows/stage50-guild-shop-tier-correlation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax without private game files
        run: python -m py_compile tools/stage48_anonymous_zlib_recovery.py tools/stage50_guild_shop_tier_correlation.py
      - name: Verify synthetic correlation and fail-closed mutation tests
        run: python tools/stage50_guild_shop_tier_correlation.py --self-test
