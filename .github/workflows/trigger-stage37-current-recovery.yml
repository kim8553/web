name: Trigger Stage37 Current Recovery

on:
  push:
    branches: [stage37-current-recovery-20260916]
    paths:
      - '.github/workflows/trigger-stage37-current-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current recovery build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jiuyin-stage37-real-build.yml --repo kim8553/web --ref stage37-current-recovery-20260916
